<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>T-GCN 預測驗證 · 預測 vs 實際</title>
<style>
:root{--bg:#0a1420;--panel:#10202e;--line:#1e3546;--ink:#e8eef4;--muted:#8ea3b5;
  --teal:#00c2d1;--pred:#ffb04a;--act:#4aa3ff;--bad:#ff5d6c;--good:#39d98a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.ctrl .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
input[type=range]{flex:1;min-width:240px;accent-color:var(--teal);height:6px}
.tlabel{font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal);min-width:150px}
.qbtn{background:#16303f;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.qbtn:hover{border-color:var(--teal)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.card .l{font-size:12px;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.box h2{font-size:15px;margin:0 0 10px;font-weight:700}
.box h2 small{color:var(--muted);font-weight:400;font-size:12px}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.seclist{display:flex;flex-direction:column;gap:9px;max-height:430px;overflow-y:auto}
.sec{border-bottom:1px solid var(--line);padding-bottom:8px}
.sec .name{font-size:13px;font-variant-numeric:tabular-nums;margin-bottom:4px;display:flex;justify-content:space-between}
.sec .err{color:var(--muted)}
.sec .err b{color:var(--ink)}
.bar{height:13px;border-radius:3px;display:flex;align-items:center;padding-left:6px;
  font-size:10px;color:#04121a;font-weight:700;margin-top:2px;white-space:nowrap}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;margin-left:6px}
.tag.c{background:rgba(255,93,108,.18);color:var(--bad)}
.note{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>T-GCN 預測驗證 <small style="color:var(--muted);font-weight:400;font-size:14px">選一個時間，看模型預測 vs 實際車速</small></h1>
  <p class="sub">重播模式：把歷史某時刻當「現在」，模型預測 30 分鐘後車速，對照真實發生的車速</p>

  <div class="ctrl">
    <div class="row">
      <span class="tlabel" id="tlabel">載入中…</span>
      <input type="range" id="slider" min="12" max="6042" value="4992" step="3"/>
    </div>
    <div class="row" style="margin-top:12px">
      <span style="color:var(--muted);font-size:13px">快速跳到：</span>
      <button class="qbtn" onclick="jump(4992)">工作日尖峰 8:00</button>
      <button class="qbtn" onclick="jump(4932)">深夜離峰 3:00</button>
      <button class="qbtn" onclick="jump(5064)">尖峰後 10:00</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div class="n" id="cNow" style="color:var(--teal);font-size:18px">—</div><div class="l">現在時刻（觀測到此）</div></div>
    <div class="card"><div class="n" id="cTgt" style="color:var(--pred);font-size:18px">—</div><div class="l">預測目標（+30 分鐘）</div></div>
    <div class="card"><div class="n" id="cMae" style="color:var(--good)">—</div><div class="l">全網平均誤差 MAE (km/h)</div></div>
    <div class="card"><div class="n" id="cCong" style="color:var(--bad)">—</div><div class="l">實際壅塞路段數</div></div>
  </div>

  <div class="grid">
    <div class="box">
      <h2>預測 vs 實際散布 <small>每點一路段，越靠對角線越準</small></h2>
      <svg id="scatter" viewBox="0 0 400 400"></svg>
      <div class="legend">
        <span><span class="dot" style="background:var(--act)"></span>順暢路段</span>
        <span><span class="dot" style="background:var(--bad)"></span>壅塞路段</span>
        <span>虛線 = 完美預測（預測＝實際）</span>
      </div>
    </div>
    <div class="box">
      <h2>最塞的路段 <small>模型預測 vs 實際</small></h2>
      <div class="seclist" id="seclist"></div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
const API = location.origin;
let debounce;

function fmtSection(s){
  // 01F0339S-01F0376S → 國1南 33.9→37.6K
  const road={'01F':'國1','03F':'國3','05F':'國5','01H':'國1高架','03A':'國3甲'};
  const dir={'N':'北','S':'南','E':'東','W':'西'};
  const parse=g=>{const p=g.slice(0,3),km=(parseInt(g.slice(3,7))/10).toFixed(1),d=g.slice(-1);
    return {road:road[p]||p,km,dir:dir[d]||d};};
  try{const parts=s.split('-');const A=parse(parts[0]),B=parse(parts[1]);
    return `${A.road}${A.dir} ${A.km}→${B.km}K`;}catch(e){return s;}
}
function fmtTime(iso){
  const d=new Date(iso);
  const wd=['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${wd}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function drawScatter(sections){
  const S=400,pad=42,W=S-pad*1.3,H=S-pad*1.3,MAX=130;
  const x=v=>pad+v/MAX*W;
  const Y=v=>(S-pad)-v/MAX*H;
  let g=`<line x1="${pad}" y1="${S-pad}" x2="${pad}" y2="${pad*0.6}" stroke="#2a4256"/>`
       +`<line x1="${pad}" y1="${S-pad}" x2="${S-8}" y2="${S-pad}" stroke="#2a4256"/>`;
  g+=`<line x1="${x(0)}" y1="${Y(0)}" x2="${x(MAX)}" y2="${Y(MAX)}" stroke="#5b7d94" stroke-dasharray="5 4"/>`;
  for(let v=0;v<=120;v+=40){
    g+=`<text x="${x(v)}" y="${S-pad+16}" fill="#8ea3b5" font-size="11" text-anchor="middle">${v}</text>`;
    g+=`<text x="${pad-8}" y="${Y(v)+4}" fill="#8ea3b5" font-size="11" text-anchor="end">${v}</text>`;
  }
  g+=`<text x="${S/2}" y="${S-6}" fill="#8ea3b5" font-size="12" text-anchor="middle">實際車速 (km/h)</text>`;
  g+=`<text x="14" y="${S/2}" fill="#8ea3b5" font-size="12" text-anchor="middle" transform="rotate(-90 14 ${S/2})">預測車速 (km/h)</text>`;
  for(const r of sections){
    const c=r.congested?'#ff5d6c':'#4aa3ff';
    g+=`<circle cx="${x(r.actual)}" cy="${Y(r.predicted)}" r="3" fill="${c}" fill-opacity="0.65"/>`;
  }
  document.getElementById('scatter').innerHTML=g;
}

function drawList(rows){
  const MAX=130;
  document.getElementById('seclist').innerHTML=rows.map(r=>{
    const pw=Math.max(2,r.predicted/MAX*100), aw=Math.max(2,r.actual/MAX*100);
    return `<div class="sec">
      <div class="name"><span>${fmtSection(r.section)}${r.congested?'<span class="tag c">塞</span>':''}</span>
        <span class="err">誤差 <b>${r.error}</b> km/h</span></div>
      <div class="bar" style="width:${pw}%;background:var(--pred)">預測 ${r.predicted}</div>
      <div class="bar" style="width:${aw}%;background:var(--act)">實際 ${r.actual}</div>
    </div>`;}).join('');
}

async function load(idx){
  document.getElementById('tlabel').textContent='查詢中…';
  try{
    const r=await fetch(`${API}/predict/compare?at_index=${idx}`);
    if(!r.ok){document.getElementById('tlabel').textContent='索引超出範圍';return;}
    const d=await r.json();
    const sl=document.getElementById('slider');
    sl.min=d.index_range[0]; sl.max=d.index_range[1];
    document.getElementById('tlabel').textContent=fmtTime(d.now_time)+'（第 '+idx+' 步）';
    document.getElementById('cNow').textContent=fmtTime(d.now_time);
    document.getElementById('cTgt').textContent=fmtTime(d.target_time);
    document.getElementById('cMae').textContent=d.mae;
    document.getElementById('cCong').textContent=d.n_congested+' / '+d.n_sections;
    drawScatter(d.sections);
    drawList(d.most_congested);
    document.getElementById('note').textContent=
      `模型看 ${fmtTime(d.now_time)} 之前 60 分鐘的車速，預測 ${d.horizon_min} 分鐘後（${fmtTime(d.target_time)}）；`+
      `全網 ${d.n_sections} 路段，平均誤差 ${d.mae} km/h。點越靠虛線＝預測越準。`;
  }catch(e){document.getElementById('tlabel').textContent='連線失敗';}
}

function jump(idx){document.getElementById('slider').value=idx;load(idx);}
document.getElementById('slider').addEventListener('input',e=>{
  clearTimeout(debounce);
  const idx=+e.target.value;
  document.getElementById('tlabel').textContent='第 '+idx+' 步…';
  debounce=setTimeout(()=>load(idx),160);
});
load(4992);
</script>
</body>
</html>
