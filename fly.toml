# fly.toml app configuration file generated for taiwan-osm-router on 2026-05-06T15:44:05+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'taiwan-osm-router'
primary_region = 'nrt'

[build]

[[mounts]]
  source = 'osm_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
