<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>台灣動態導航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#060d1a;--surf:rgba(11,22,40,.92);--surf2:rgba(16,31,53,.95);--border:#192c47;
  --accent:#00d4ff;--acc2:#0099cc;--green:#00e5a0;--amber:#ffb400;
  --red:#ff4444;--text:#cde4f5;--muted:#4a6d99;
  --mono:'JetBrains Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif;
  --radius:12px;--panel-w:340px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}

#map{position:fixed;inset:0;z-index:0}

/* Route Panel (top-left) */
.route-panel{
  position:fixed;top:16px;left:16px;z-index:600;
  width:var(--panel-w);background:var(--surf);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.rp-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rp-header h1{font-family:var(--cond);font-size:18px;font-weight:700;color:var(--accent);flex:1}
.rp-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.3s}
.rp-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.rp-dot.off{background:var(--red)}

.search-group{position:relative;margin-bottom:8px}
.search-row{display:flex;gap:6px;align-items:center}
.search-input{
  flex:1;background:rgba(6,13,26,.7);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:14px;color:var(--text);outline:none;transition:.15s;
  font-family:var(--sans);
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.loc-btn{
  width:36px;height:36px;border-radius:8px;background:rgba(6,13,26,.7);
  border:1px solid var(--border);color:var(--accent);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;
}
.loc-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}

.suggestions{
  position:absolute;top:100%;left:0;right:0;z-index:700;
  background:rgba(11,22,40,.97);border:1px solid var(--border);border-radius:8px;
  margin-top:4px;max-height:200px;overflow-y:auto;display:none;
}
.suggestions.show{display:block}
.sug-item{
  padding:10px 12px;font-size:13px;color:var(--text);cursor:pointer;
  border-bottom:1px solid rgba(25,44,71,.5);transition:.1s;
}
.sug-item:last-child{border-bottom:none}
.sug-item:hover{background:rgba(0,212,255,.1)}
.sug-item .sug-src{font-size:10px;color:var(--muted);margin-left:6px}

.mode-pills{display:flex;gap:4px;margin:10px 0}
.pill{
  flex:1;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:600;
  font-family:var(--cond);cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);transition:.15s;user-select:none;
}
.pill.active{background:var(--accent);border-color:var(--accent);color:#000}
.pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}

.nav-btn{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:var(--accent);color:#000;font-family:var(--cond);
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:.15s;
}
.nav-btn:hover{background:var(--acc2)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

.rp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.rp-footer a{font-size:11px;color:var(--muted);text-decoration:none}
.rp-footer a:hover{color:var(--accent)}
.rp-msg{font-size:11px;margin-top:6px;padding:5px 8px;border-radius:6px;font-family:var(--mono);display:none}
.rp-msg.ok{background:#001f14;color:var(--green);border:1px solid #00402a;display:block}
.rp-msg.err{background:#200000;color:var(--red);border:1px solid #500000;display:block}
.rp-msg.info{background:#001428;color:var(--accent);border:1px solid #003355;display:block}

/* Layer Button (top-right) */
.layer-btn{
  position:fixed;top:16px;right:16px;z-index:600;
  width:40px;height:40px;border-radius:10px;background:var(--surf);backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--text);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.layer-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.layer-dropdown{
  position:fixed;top:62px;right:16px;z-index:600;
  background:var(--surf);backdrop-filter:blur(16px);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;min-width:180px;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.layer-dropdown.show{display:block}
.ld-item{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;user-select:none}
.ld-dot{width:10px;height:10px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.ld-label{font-size:12px;color:var(--muted);flex:1}
.ld-item.on .ld-label{color:var(--text)}
.ld-count{font-family:var(--mono);font-size:11px;color:var(--accent)}

/* GPS Button (bottom-right) */
.gps-btn{
  position:fixed;bottom:30px;right:16px;z-index:600;
  width:44px;height:44px;border-radius:50%;background:var(--surf);backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--accent);font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.gps-btn:hover{background:var(--accent);color:#000}
.gps-btn.tracking{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.3)}

/* Result Panel (bottom) */
.result-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:var(--surf2);backdrop-filter:blur(16px);border-top:1px solid var(--border);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:16px 20px;transform:translateY(100%);transition:transform .35s ease;
  max-height:45vh;overflow-y:auto;
}
.result-panel.show{transform:translateY(0)}
.rp-close{
  position:absolute;top:10px;right:16px;background:none;border:none;
  color:var(--muted);font-size:18px;cursor:pointer;width:auto;padding:4px;
}
.rp-close:hover{color:var(--text)}
.result-summary{display:flex;gap:20px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.rs-big{font-family:var(--cond);font-size:24px;font-weight:700;color:var(--accent)}
.rs-sub{font-size:13px;color:var(--muted)}
.result-steps{list-style:none}
.result-steps li{
  padding:8px 0;border-bottom:1px solid rgba(25,44,71,.4);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.result-steps li:last-child{border-bottom:none}
.step-icon{width:24px;height:24px;border-radius:6px;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);flex-shrink:0}
.step-name{flex:1;color:var(--text)}
.step-dist{font-family:var(--mono);font-size:11px;color:var(--muted)}
.result-actions{display:flex;gap:8px;margin-top:12px}
.ra-btn{
  padding:8px 16px;border-radius:8px;font-size:12px;font-family:var(--cond);
  font-weight:600;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);width:auto;transition:.15s;
}
.ra-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Legend */
.legend{
  position:fixed;bottom:30px;left:16px;z-index:400;
  background:var(--surf);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:11px;color:var(--muted);
  font-family:var(--mono);line-height:1.8;
}
.legend b{color:var(--text)}

/* Loading */
/* 事件通知 toast */
.toast-stack{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:850;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(420px,90vw)}
.toast{background:rgba(10,20,38,.95);border:1px solid rgba(255,255,255,.15);border-left:4px solid #ffb400;
  color:#eee;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;
  box-shadow:0 4px 18px rgba(0,0,0,.45);pointer-events:auto;cursor:pointer;
  animation:toastIn .3s ease;transition:opacity .4s,transform .4s}
.toast.pred{border-left-color:#b388ff}
.toast.hide{opacity:0;transform:translateY(-8px)}
.toast b{color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
#loader{display:none;position:fixed;inset:0;background:rgba(6,13,26,.75);z-index:999;
  align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loader.show{display:flex}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-family:var(--cond);font-size:16px;color:var(--accent)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.8)}}
.gps-pulse{animation:pulse 2s ease-in-out infinite}

/* Heading-up rotation */
#map.heading-up{transform-origin:center center;transition:transform 0.6s ease-out}
.gps-arrow-svg{transition:transform 0.3s ease-out}

/* Driving Mode：導航介面（依手機導航的慣例：上方轉彎卡、下方剩餘時間） */
body.driving .route-panel,
body.driving .layer-btn,
body.driving .layer-dropdown,
body.driving .legend,
body.driving .result-panel,
body.driving .gps-btn,
body.driving .leaflet-control-container{display:none!important}
body.driving .toast-stack{top:150px}           /* 轉彎卡下方，不擋到車子與底部面板 */

:root{
  --nav-green:#0f7a43;--nav-green-dk:#0a5a31;--nav-ink:#1f1f1f;--nav-sub:#5e6368;
  --nav-eta:#137333;--nav-line:#e3e5e8;--nav-blue:#1a73e8;
  --nav-font:'Barlow','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
.drive-hud{display:none;position:fixed;inset:0;z-index:800;pointer-events:none;font-family:var(--nav-font)}
body.driving .drive-hud{display:block}
.nav-col{position:absolute;left:12px;right:12px;max-width:460px}
.nav-top{top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.nav-banner{width:100%;display:flex;align-items:center;gap:14px;background:var(--nav-green);color:#fff;
  border-radius:16px;padding:14px 18px 14px 14px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.nav-ico{width:56px;height:56px;flex-shrink:0}
.nav-ico svg,.nav-then-ico svg{width:100%;height:100%;display:block}
.nav-ico .h,.nav-then-ico .h{fill:#fff;stroke:none}
.nav-dist{font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.nav-dist small{font-size:20px;font-weight:500;margin-left:5px}
.nav-instr{font-size:19px;font-weight:600;line-height:1.3;margin-top:3px;overflow-wrap:anywhere}
.nav-then{display:none;align-items:center;gap:8px;background:var(--nav-green-dk);color:#fff;
  border-radius:12px;padding:7px 14px 7px 12px;font-size:16px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.nav-then.show{display:flex}
.nav-then-ico{width:26px;height:26px}
.nav-arrived .nav-banner{background:var(--nav-ink)}

.nav-bottom{bottom:12px;display:flex;flex-direction:column;gap:10px}
.nav-float{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.nav-speed{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--nav-ink);flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.nav-speed b{font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.nav-speed span{font-size:11px;color:var(--nav-sub)}
.nav-road{background:rgba(32,33,36,.88);color:#fff;border-radius:10px;padding:6px 12px;font-size:15px;
  font-weight:600;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-road:empty{visibility:hidden}
.nav-recenter{pointer-events:auto;visibility:hidden;display:flex;align-items:center;gap:6px;background:#fff;
  color:var(--nav-blue);border:none;border-radius:22px;padding:10px 16px;font:600 15px var(--nav-font);
  box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;flex-shrink:0}
.nav-recenter.show{visibility:visible}
.nav-sim{pointer-events:auto;display:none;align-items:center;gap:6px;background:#fff;color:var(--nav-ink);
  border-radius:14px;padding:6px 8px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;width:max-content}
.nav-sim.show{display:flex}
.nav-sim .lbl{color:var(--nav-sub);padding:0 4px}
.nav-sim button{border:1px solid var(--nav-line);background:#fff;border-radius:9px;padding:5px 10px;
  font:600 13px var(--nav-font);color:var(--nav-ink);cursor:pointer}
.nav-sim button.on{background:var(--nav-blue);border-color:var(--nav-blue);color:#fff}
.nav-sheet{pointer-events:auto;background:#fff;color:var(--nav-ink);border-radius:18px;padding:14px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px}
.nav-x,.nav-ov{width:48px;height:48px;border-radius:50%;border:1px solid var(--nav-line);background:#fff;
  color:var(--nav-ink);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-x{font-size:22px}
.nav-x:hover,.nav-ov:hover{background:#f1f3f4}
.nav-ov svg{width:22px;height:22px}
.nav-eta{flex:1;min-width:0}
.nav-eta-min{font-size:30px;font-weight:600;color:var(--nav-eta);line-height:1.05;font-variant-numeric:tabular-nums}
.nav-eta-sub{font-size:15px;color:var(--nav-sub);margin-top:3px}
.nav-car svg{width:44px;height:44px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
  transition:transform .3s ease-out}
.nav-x:focus-visible,.nav-ov:focus-visible,.nav-recenter:focus-visible,.nav-sim button:focus-visible{
  outline:3px solid #fbbc04;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#map.heading-up,.nav-car svg{transition:none}}
@media(max-width:520px){.nav-dist{font-size:30px}.nav-instr{font-size:17px}.nav-ico{width:48px;height:48px}}

@media(max-width:600px){
  .route-panel{top:8px;left:8px;right:8px;width:auto}
  .legend{display:none}
  .result-panel{max-height:55vh}
}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div class="ltxt" id="ltxt">路線計算中...</div></div>
<div id="map"></div>
<div class="toast-stack" id="toastStack"></div>

<!-- Route Panel -->
<div class="route-panel">
  <div class="rp-header">
    <h1>台灣動態導航</h1>
    <div class="rp-dot" id="connDot"></div>
  </div>

  <div class="search-group">
    <div class="search-row">
      <input class="search-input" id="inputStart" placeholder="起點：地址、地標或座標" autocomplete="off"/>
      <button class="loc-btn" id="btnGpsStart" title="使用目前位置">📍</button>
    </div>
    <div class="suggestions" id="sugStart"></div>
  </div>

  <div class="search-group">
    <div class="search-row">
      <input class="search-input" id="inputEnd" placeholder="終點：地址、地標或座標" autocomplete="off"/>
    </div>
    <div class="suggestions" id="sugEnd"></div>
  </div>

  <div class="mode-pills">
    <div class="pill" data-mode="fastest" onclick="setMode('fastest')">⚡ 最快</div>
    <div class="pill active" data-mode="balanced" onclick="setMode('balanced')">⚖ 平衡</div>
    <div class="pill" data-mode="safest" onclick="setMode('safest')">🛡 安全</div>
  </div>

  <button class="nav-btn" onclick="navigate()">開始導航</button>
  <div class="rp-msg" id="rpMsg"></div>

  <div class="rp-footer">
    <span style="font-size:10px;color:var(--muted)">點地圖設定起終點</span>
    <span><a href="/predict/demo" target="_blank">📊 預測驗證</a>　<a href="/admin">⚙ 管理</a></span>
  </div>
</div>

<!-- Layer Button -->
<button class="layer-btn" onclick="toggleLayerPanel()">🗂</button>
<div class="layer-dropdown" id="layerDrop">
  <div class="ld-item on" onclick="toggleLayer('congestion')">
    <div class="ld-dot" style="background:#ff4444"></div>
    <div class="ld-label">車速壅塞</div>
    <div class="ld-count" id="olCong">—</div>
  </div>
  <div class="ld-item on" onclick="toggleLayer('events')">
    <div class="ld-dot" style="background:#ffb400"></div>
    <div class="ld-label">交通事件</div>
    <div class="ld-count" id="olEvt">—</div>
  </div>
  <div class="ld-item on" onclick="toggleLayer('weather')">
    <div class="ld-dot" style="background:#4a9eff"></div>
    <div class="ld-label">天氣影響</div>
    <div class="ld-count" id="olWx">—</div>
  </div>
  <div class="ld-item on" onclick="toggleLayer('prediction')">
    <div class="ld-dot" style="background:#b388ff"></div>
    <div class="ld-label">🔮 預測壅塞</div>
    <div class="ld-count" id="olPred">—</div>
  </div>
</div>

<!-- GPS Button -->
<button class="gps-btn" id="gpsBtn" onclick="centerGps()">⊕</button>

<!-- Legend -->
<div class="legend">
  <b>道路類型</b><br>
  <span style="color:#00d4ff">━</span> 高速公路<br>
  <span style="color:#00e5a0">━</span> 快速道路<br>
  <span style="color:#ffb400">━</span> 主要道路<br>
  <span style="color:#a78bfa">━</span> 次要道路<br>
  <span style="color:#6b7280">━</span> 其他
</div>

<!-- Driving HUD：導航介面 -->
<div class="drive-hud" id="driveHud">
  <div class="nav-col nav-top">
    <div class="nav-banner" role="status" aria-live="polite">
      <div class="nav-ico" id="navIco"></div>
      <div>
        <div class="nav-dist" id="navDist">—</div>
        <div class="nav-instr" id="navInstr"></div>
      </div>
    </div>
    <div class="nav-then" id="navThen"><span>然後</span><span class="nav-then-ico" id="navThenIco"></span></div>
  </div>
  <div class="nav-col nav-bottom">
    <div class="nav-float">
      <div class="nav-speed"><b id="navSpeed">0</b><span>km/h</span></div>
      <div class="nav-road" id="navRoad"></div>
      <button class="nav-recenter" id="navRecenter" onclick="driveRecenter()">⌖ 重新置中</button>
    </div>
    <div class="nav-sim" id="navSim">
      <span class="lbl">模擬行駛</span>
      <button id="simPlay" onclick="toggleSim()">暫停</button>
      <button data-f="1" onclick="setSimFactor(1)">×1</button>
      <button data-f="4" onclick="setSimFactor(4)">×4</button>
      <button data-f="10" onclick="setSimFactor(10)">×10</button>
    </div>
    <div class="nav-sheet">
      <button class="nav-x" onclick="stopDriving()" aria-label="結束導航" title="結束導航">✕</button>
      <div class="nav-eta">
        <div class="nav-eta-min" id="navEtaMin">—</div>
        <div class="nav-eta-sub" id="navEtaSub">—</div>
      </div>
      <button class="nav-ov" onclick="navOverview()" aria-label="路線概覽" title="路線概覽">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.2 16.6 15.8 7.4"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Result Panel -->
<div class="result-panel" id="resultPanel">
  <button class="rp-close" onclick="closeResult()">✕</button>
  <div class="result-summary" id="resSummary"></div>
  <ul class="result-steps" id="resSteps"></ul>
  <div class="result-actions">
    <button class="ra-btn" onclick="startDriving()" style="background:var(--accent);color:#000;border-color:var(--accent);font-size:14px;padding:10px 20px">▶ 開始行駛</button>
    <button class="ra-btn" onclick="dlAnalysis()">下載分析</button>
    <button class="ra-btn" onclick="clearRoute()">清除路線</button>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API_BASE=(window.__API_BASE||location.origin).replace(/\/$/,'');
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let mode='balanced', clickPhase='start';
let startCoord=null, endCoord=null;
let startM=null, endM=null, routeL=null, latestRoute=null, altRouteLayers=[];
let gpsMarker=null, gpsCircle=null, watchId=null, gpsCoord=null;
let searchTimer=null;

const map=L.map('map',{zoomControl:false}).setView([23.7,121.0],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OSM',maxZoom:19}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

const mkIcon=color=>L.divIcon({className:'',iconAnchor:[8,8],
  html:`<div style="width:16px;height:16px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 8px ${color}80"></div>`});
const startIcon=mkIcon('#00e5a0'), endIcon=mkIcon('#ff4444');

map.on('click',e=>{
  const{lat,lng}=e.latlng;
  if(clickPhase==='start'){
    setStart(lat,lng,`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    clickPhase='end';
  }else{
    setEnd(lat,lng,`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    clickPhase='start';

function setStart(lat,lon,label){
  startCoord={lat,lon};
  document.getElementById('inputStart').value=label;
  if(startM)map.removeLayer(startM);
  startM=L.marker([lat,lon],{icon:startIcon}).addTo(map).bindPopup('起點');
}
function setEnd(lat,lon,label){
  endCoord={lat,lon};
  document.getElementById('inputEnd').value=label;
  if(endM)map.removeLayer(endM);
  endM=L.marker([lat,lon],{icon:endIcon}).addTo(map).bindPopup('終點');
}

async function call(path,opts={}){
  const r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json'},...opts});
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json():await r.text();
  if(!r.ok)throw new Error(typeof body==='string'?`HTTP ${r.status}: ${body}`:(body.detail||`HTTP ${r.status}`));
  return body;
}
function showMsg(text,type='info'){
  const el=document.getElementById('rpMsg');el.textContent=text;el.className=`rp-msg ${type}`;
}
function hideMsg(){document.getElementById('rpMsg').className='rp-msg';}
// 自動發生的狀態變化（行駛中路線面板是隱藏的）：同時用通知卡片顯示
function notify(text,type='info'){if(!driving)showMsg(text,type);showToast(escHtml(text),'',7000);}

}

// Geocoding
function isCoordStr(s){
  const m=s.match(/^\s*(-?\d+\.?\d*)\s*[,，\s]\s*(-?\d+\.?\d*)\s*$/);
  if(!m)return null;
  const a=parseFloat(m[1]),b=parseFloat(m[2]);
  if(a>=21.5&&a<=26.5&&b>=118&&b<=122.5)return{lat:a,lon:b};
  if(b>=21.5&&b<=26.5&&a>=118&&a<=122.5)return{lat:b,lon:a};
  return null;
}

function setupSearch(inputId,sugId,onSelect){
  const input=document.getElementById(inputId);
  const sugBox=document.getElementById(sugId);

  input.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    const q=input.value.trim();
    if(q.length<2){sugBox.classList.remove('show');return;}
    const coord=isCoordStr(q);
    if(coord){
      sugBox.innerHTML=`<div class="sug-item" data-lat="${coord.lat}" data-lon="${coord.lon}">📍 ${coord.lat.toFixed(5)}, ${coord.lon.toFixed(5)}<span class="sug-src">座標</span></div>`;
      sugBox.classList.add('show');
      return;
    }
    searchTimer=setTimeout(async()=>{
      try{
        const res=await call('/geocode?q='+encodeURIComponent(q));
        if(!res.length){sugBox.classList.remove('show');return;}
        sugBox.innerHTML=res.map(r=>
          `<div class="sug-item" data-lat="${escHtml(r.lat)}" data-lon="${escHtml(r.lon)}">${escHtml(r.name)}<span class="sug-src">${escHtml(r.source)}</span></div>`
        ).join('');
        sugBox.classList.add('show');
      }catch(e){sugBox.classList.remove('show');}
    },600);
  });

  input.addEventListener('focus',()=>{if(sugBox.children.length)sugBox.classList.add('show');});
  input.addEventListener('blur',()=>{setTimeout(()=>sugBox.classList.remove('show'),200);});

  sugBox.addEventListener('click',e=>{
    const item=e.target.closest('.sug-item');
    if(!item)return;
    const lat=parseFloat(item.dataset.lat),lon=parseFloat(item.dataset.lon);
    const label=item.childNodes[0].textContent.trim();
    onSelect(lat,lon,label);
    sugBox.classList.remove('show');
  });
}

// GPS
let gpsError=null;
function initGps(){
  if(!navigator.geolocation){gpsError='瀏覽器不支���定位';return;}
  navigator.geolocation.getCurrentPosition(
    pos=>onGpsPos(pos),
    err=>onGpsErr(err),
    {enableHighAccuracy:true,timeout:10000}
  );
  watchId=navigator.geolocation.watchPosition(
    pos=>onGpsPos(pos),
    err=>onGpsErr(err),
    {enableHighAccuracy:true,maximumAge:10000,timeout:15000}
  );
}
function onGpsPos(pos){
  const{latitude:lat,longitude:lng,accuracy,heading:gpsHeading,speed:gpsSpeed}=pos.coords;
  const prevGps=gpsCoord?{lat:gpsCoord.lat,lon:gpsCoord.lon}:null;
  gpsCoord={lat,lon:lng};
  gpsError=null;
  if(driving){
    if(!driveSim){                              // 示範模式不跟隨實際定位
      if(gpsMarker)gpsMarker.setLatLng([lat,lng]);
      let bearing=null;
      if(gpsHeading!=null&&isFinite(gpsHeading)&&gpsSpeed>0.5) bearing=gpsHeading;
      else if(prevGps&&distBetween(prevGps.lat,prevGps.lon,lat,lng)>0.003)
        bearing=calcBearing(prevGps.lat,prevGps.lon,lat,lng);
      if(bearing!=null) gpsMovingBearing=bearing;
    }
  }else{
    if(!gpsMarker){
      gpsMarker=L.circleMarker([lat,lng],{radius:7,fillColor:'#4a9eff',color:'#fff',weight:2,fillOpacity:1,className:'gps-pulse'});
      gpsCircle=L.circle([lat,lng],{radius:accuracy,fillColor:'#4a9eff',color:'#4a9eff',weight:1,fillOpacity:.08,opacity:.2});
    }else{
      gpsMarker.setLatLng([lat,lng]);
      if(gpsCircle)gpsCircle.setLatLng([lat,lng]).setRadius(accuracy);
    }
    if(map.hasLayer(gpsMarker)){map.removeLayer(gpsMarker);if(gpsCircle)map.removeLayer(gpsCircle);}
  }
  document.getElementById('gpsBtn').classList.add('tracking');
  if(driving&&!driveSim) onDriveGpsUpdate();
}
function onGpsErr(err){
  document.getElementById('gpsBtn').classList.remove('tracking');
  if(err.code===1) gpsError='定位權限被拒���，請在瀏覽器允���位置存取';
  else if(err.code===2) gpsError='無法取得位置（GPS 無訊號）';
  else gpsError='定位��時，請重試';
}
function centerGps(){
  if(gpsCoord){map.setView([gpsCoord.lat,gpsCoord.lon],15);return;}
  if(gpsError){showMsg(gpsError,'err');return;}
  showMsg('定位���，請稍候...','info');
  navigator.geolocation.getCurrentPosition(
    pos=>{onGpsPos(pos);map.setView([gpsCoord.lat,gpsCoord.lon],15);hideMsg();},
    err=>{onGpsErr(err);showMsg(gpsError,'err');},
    {enableHighAccuracy:true,timeout:10000}
  );
}

document.getElementById('btnGpsStart').addEventListener('click',()=>{
  if(gpsCoord){setStart(gpsCoord.lat,gpsCoord.lon,'📍 目前位置');return;}
  if(gpsError){showMsg(gpsError,'err');return;}
  showMsg('正在取得位置...','info');
  navigator.geolocation.getCurrentPosition(
    pos=>{onGpsPos(pos);setStart(gpsCoord.lat,gpsCoord.lon,'📍 目前位置');hideMsg();},
    err=>{onGpsErr(err);showMsg(gpsError,'err');},
    {enableHighAccuracy:true,timeout:10000}
  );
});

// Navigate
async function navigate(){
  hideMsg();
  if(!startCoord){showMsg('請設定起點','err');return;}
  if(!endCoord){showMsg('請設定終點','err');return;}
  const{lat:sLat,lon:sLon}=startCoord,{lat:eLat,lon:eLon}=endCoord;
  if(sLat<21.5||sLat>26.5||sLon<118||sLon>122.5){showMsg('起點超出台灣範圍','err');return;}
  if(eLat<21.5||eLat>26.5||eLon<118||eLon>122.5){showMsg('終點超出台灣範圍','err');return;}

  loading(true,'A* 路徑計算中...');
  try{
    const d=await call('/route',{method:'POST',body:JSON.stringify({
      start_lat:sLat,start_lon:sLon,end_lat:eLat,end_lon:eLon,mode,alternatives:true
    })});
    latestRoute=d;
    renderRoute(d);
    showMsg(`${d.total_km.toFixed(1)} km · ${d.total_min.toFixed(0)} 分鐘`,'ok');
  }catch(e){showMsg(e.message,'err');}
  finally{loading(false);}
}

function clearAltRoutes(){altRouteLayers.forEach(l=>{map.removeLayer(l)});altRouteLayers=[];}

function renderRoute(d,{fit=true}={}){
  clearAltRoutes();
  if(routeL){if(routeL._outline)map.removeLayer(routeL._outline);map.removeLayer(routeL);routeL=null;}

  if(d.alternatives?.length){
    d.alternatives.forEach((alt,i)=>{
      if(!alt.geojson?.features?.length)return;
      const outline=L.geoJSON(alt.geojson,{
        style:()=>({color:'#555',weight:7,opacity:0.3,lineCap:'round',lineJoin:'round',dashArray:'8 6'}),
        interactive:false
      }).addTo(map);
      const line=L.geoJSON(alt.geojson,{
        style:()=>({color:'#90a4ae',weight:4,opacity:0.6,lineCap:'round',lineJoin:'round',dashArray:'8 6'})
      }).addTo(map);
      line.eachLayer(layer=>{
        layer.bindPopup(`<b>替代路線 ${i+1}</b><br>${alt.total_km.toFixed(1)} km · ${alt.total_min.toFixed(0)} 分`);
        layer.on('click',()=>{
          latestRoute=alt;
          renderRoute(alt);
          showMsg(`${alt.total_km.toFixed(1)} km · ${alt.total_min.toFixed(0)} 分鐘（替代路線）`,'ok');
        });
      });
      altRouteLayers.push(outline,line);
    });
  }

  if(d.geojson?.features?.length){
    const routeOutline=L.geoJSON(d.geojson,{
      style:()=>({color:'#1a1a2e',weight:9,opacity:0.6,lineCap:'round',lineJoin:'round'}),
      interactive:false
    }).addTo(map);
    routeL=L.geoJSON(d.geojson,{
      style:f=>{
        const hw=f.properties?.highway||'';
        const c={'motorway':'#00bfff','trunk':'#00e676','primary':'#ffa726',
                  'secondary':'#ab47bc','tertiary':'#78909c'}[hw]||'#5c8ab5';
        return{color:c,weight:6,opacity:1,lineCap:'round',lineJoin:'round'};
      },
      onEachFeature:(f,layer)=>{
        const p=f.properties||{};
        layer.bindPopup(`<b>${escHtml(p.name||p.highway||'—')}</b><br>${(p.length_km||0).toFixed(2)} km`);
      }
    }).addTo(map);
    routeL._outline=routeOutline;
    const b=routeL.getBounds();
    if(fit&&b.isValid())map.fitBounds(b.pad(.08));
  }

  if(d.closed_km>0)
    showToast(`⛔ 起點或終點在封閉道路上，路線先沿封閉路段駛離 ${(d.closed_km*1000).toFixed(0)} 公尺`,'',10000);

  const modeLabel={'fastest':'最快','balanced':'平衡','safest':'安全'}[d.mode]||d.mode;
  document.getElementById('resSummary').innerHTML=
    `<span class="rs-big">${d.total_km.toFixed(1)} km</span>
     <span class="rs-big">${d.total_min.toFixed(0)} 分鐘</span>
     <span class="rs-sub">${modeLabel}路線 · ${d.num_edges} 路段</span>`;

  const merged=[];
  let prev=null,km=0,mn=0;
  (d.edges||[]).forEach(e=>{
    const nm=e.name||e.highway||'—';
    if(nm===prev){km+=e.length_km||0;mn+=e.travel_min||0;}
    else{if(prev)merged.push({nm:prev,km,mn});prev=nm;km=e.length_km||0;mn=e.travel_min||0;}
  });
  if(prev)merged.push({nm:prev,km,mn});

  document.getElementById('resSteps').innerHTML=merged.slice(0,30).map((s,i)=>
    `<li><div class="step-icon">${i+1}</div><span class="step-name">${escHtml(s.nm)}</span><span class="step-dist">${s.km.toFixed(1)} km</span></li>`
  ).join('');

  document.getElementById('resultPanel').classList.add('show');
}

function setHeadingUp(on){

// ── 轉彎點：路名改變的地方；轉彎角度用路口前後各約 40 公尺的方向計算（不受彎道形狀點影響）
const HW_LABEL={motorway:'國道',motorway_link:'匝道',trunk:'快速道路',trunk_link:'匝道',
  primary:'主要道路',primary_link:'匝道',secondary:'道路',secondary_link:'匝道',tertiary:'道路',
  tertiary_link:'匝道',residential:'巷道',service:'巷道',living_street:'巷道',unclassified:'道路',road:'道路'};
function roadKey(e){return e.name||e.highway||'';}
function roadName(e){return e.name||HW_LABEL[e.highway]||'道路';}

function turnAngle(E,i){
  let j=i-1,acc=0;
  while(j>0&&acc+(E[j].length_km||0)<0.04){acc+=E[j].length_km||0;j--;}
  let k=i;acc=0;
  while(k<E.length-1&&acc+(E[k].length_km||0)<0.04){acc+=E[k].length_km||0;k++;}
  const b1=calcBearing(E[j].lat_a,E[j].lon_a,E[i].lat_a,E[i].lon_a);
  const b2=calcBearing(E[i].lat_a,E[i].lon_a,E[k].lat_b,E[k].lon_b);
  return((b2-b1+540)%360)-180;               // 正＝右轉
}

function maneuver(t,e){
  const a=Math.abs(t),R=t>0;
  let type,verb;
  if(a<20){type='straight';verb='直行';}
  else if(a<45){type=R?'slight-right':'slight-left';verb=R?'靠右':'靠左';}
  else if(a<135){type=R?'right':'left';verb=R?'右轉':'左轉';}
  else if(a<165){type=R?'sharp-right':'sharp-left';verb=R?'向右急轉':'向左急轉';}
  else{type='uturn';verb='迴轉';}
  const ramp=/_link$/.test(e.highway||'')&&!e.name;
  if(ramp)return{type,text:type==='straight'?'駛入匝道':`${verb}駛入匝道`};
  return{type,text:`${verb}進入${roadName(e)}`};
}

function buildNav(route){
  const E=route.edges||[],n=E.length;
  const cum=new Float64Array(n+1),tail=new Float64Array(n+1);
  for(let i=0;i<n;i++)cum[i+1]=cum[i]+(E[i].length_km||0);
  for(let i=n-1;i>=0;i--)tail[i]=tail[i+1]+(E[i].travel_min||0);
  // 路名改變處＝轉彎點
  const cuts=[];
  for(let i=1;i<n;i++)if(roadKey(E[i])!==roadKey(E[i-1]))cuts.push(i);
  // 1) 路名閃爍：A → 不到 25 公尺的 X → A，視為一直在 A 上（兩個轉彎點都拿掉）
  for(let c=0;c+1<cuts.length;){
    if(cum[cuts[c+1]]-cum[cuts[c]]<0.025&&roadKey(E[cuts[c+1]])===roadKey(E[cuts[c]-1])){
      cuts.splice(c,2);c=Math.max(0,c-1);
    }else c++;
  }
  // 2) 兩個轉彎點相距不到 25 公尺（例如很短的匝道接下一條路）：只留後面那個
  const keep=cuts.filter((i,c)=>!(c+1<cuts.length&&cum[cuts[c+1]]-cum[i]<0.025));
  const mans=keep.map(i=>({i,at:cum[i],...maneuver(turnAngle(E,i),E[i])}));
  mans.push({i:n,at:cum[n],type:'arrive',text:'抵達目的地'});
  return{E,cum,tail,total:cum[n],mans,arrived:false};
}

function fmtDist(km){
  if(km>=1)return{n:km>=10?km.toFixed(0):km.toFixed(1),u:'公里'};
  const m=km*1000;
  const r=m>=300?Math.round(m/50)*50:m>=100?Math.round(m/10)*10:Math.round(m/5)*5;
  return{n:String(r),u:'公尺'};
}
function fmtMin(min){

}

// ── 在路線上的位置
function navPoint(s){
  const{E,cum}=nav;let i=s>=cum[navIdx]?navIdx:0;
  while(i<E.length-1&&cum[i+1]<=s)i++;
  const e=E[i],t=Math.min(1,Math.max(0,(s-cum[i])/((e.length_km||0)||1e-9)));
  return{i,t,lat:e.lat_a+(e.lat_b-e.lat_a)*t,lon:e.lon_a+(e.lon_b-e.lon_a)*t};
}
function projSeg(lat,lon,e){                 // 平面近似：點到路段的距離（公里）與投影比例
  const kx=111.32*Math.cos(lat*Math.PI/180),ky=110.574;
  const ax=(e.lon_a-lon)*kx,ay=(e.lat_a-lat)*ky,dx=(e.lon_b-e.lon_a)*kx,dy=(e.lat_b-e.lat_a)*ky;
  const L2=dx*dx+dy*dy;
  const t=L2>0?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L2)):0;
  return{d:Math.hypot(ax+dx*t,ay+dy*t),t};
}
function navSnap(lat,lon){
  const{E,cum}=nav;let best={d:Infinity,i:0,t:0};
  const scan=(a,b)=>{for(let i=a;i<b;i++){const r=projSeg(lat,lon,E[i]);if(r.d<best.d)best={d:r.d,i,t:r.t};}};
  scan(Math.max(0,navIdx-20),Math.min(E.length,navIdx+400));
  if(best.d>0.15)scan(0,E.length);
  return{...best,s:cum[best.i]+best.t*(E[best.i].length_km||0)};
}
function navBearingAhead(s){
  const a=navPoint(s),b=navPoint(Math.min(nav.total,s+0.05));
  return distBetween(a.lat,a.lon,b.lat,b.lon)<0.003?currentBearing:calcBearing(a.lat,a.lon,b.lat,b.lon);
}

// 鏡頭：地圖朝行進方向旋轉，車子放在畫面下方（CAR_AT），前方看得比較遠
function navCamera(lat,lon,animate){
  const z=map.getZoom(),off=(CAR_AT-0.5)*window.innerHeight,r=currentBearing*Math.PI/180;
  const c=map.unproject(map.project([lat,lon],z).add(L.point(Math.sin(r)*off,-Math.cos(r)*off)),z);
  if(animate)map.panTo(c,{animate:true,duration:.25,easeLinearity:1});
  else map.setView(c,z,{animate:false});
}

function markDone(upto){
  if(!routeL||upto<=navDoneIdx)return;
  let k=0;
  routeL.eachLayer(l=>{if(k>=navDoneIdx&&k<upto)l.setStyle(DONE_ROUTE_STYLE);k++;});
  navDoneIdx=upto;
}

function navUpdate(animate=true){
  if(!driving||!nav)return;
  const p=navPoint(navS);
  navIdx=p.i;
  const heading=navBearingAhead(navS);
  if(gpsMarker){
    gpsMarker.setLatLng([p.lat,p.lon]);
    const svg=gpsMarker.getElement()?.querySelector('svg');
    if(svg)svg.style.transform=`rotate(${heading}deg)`;   // 車頭朝行進方向（與地圖旋轉無關）
  }
  if(driveSim)driveSim={lat:p.lat,lon:p.lon};
  markDone(navIdx);
  if(driveFollowing){applyMapRotation(heading);navCamera(p.lat,p.lon,animate);}
  renderNavHud();
  if(nav.total-navS<0.02)navArrive();
}

function renderNavHud(){
  const{mans,tail,E,total,cum}=nav;
  let k=mans.findIndex(m=>m.at>navS+0.003);if(k<0)k=mans.length-1;
  const m=mans[k],m2=mans[k+1],d=fmtDist(Math.max(0,m.at-navS));
  navEl('navIco').innerHTML=navIcon(m.type);
  navEl('navDist').innerHTML=`${d.n}<small>${d.u}</small>`;
  navEl('navInstr').textContent=m.text;
  const showThen=!!m2&&m2.at-m.at<THEN_KM;
  navEl('navThen').classList.toggle('show',showThen);
  if(showThen)navEl('navThenIco').innerHTML=navIcon(m2.type);
  const e=E[navIdx],t=e?Math.max(0,(navS-cum[navIdx])/((e.length_km||0)||1e-9)):0;
  navEl('navRoad').textContent=e?roadName(e):'';
  const remMin=Math.max(0,tail[navIdx]-t*(e?.travel_min||0)),rk=fmtDist(Math.max(0,total-navS));
  const eta=new Date(Date.now()+remMin*60000).toLocaleTimeString('zh-TW',{hour:'numeric',minute:'2-digit'});
  navEl('navEtaMin').textContent=fmtMin(remMin);
  navEl('navEtaSub').textContent=`${rk.n} ${rk.u}，${eta} 抵達`;
  navEl('navSpeed').textContent=Math.round(currentSpeed);
}

function navArrive(){
  if(nav.arrived)return;
  nav.arrived=true;simPlaying=false;currentSpeed=0;updateSimButtons();
  document.body.classList.add('nav-arrived');
  navEl('navIco').innerHTML=navIcon('arrive');
  navEl('navDist').textContent='已抵達';
  navEl('navInstr').textContent=document.getElementById('inputEnd')?.value||'目的地';
  navEl('navThen').classList.remove('show');
  navEl('navSim').classList.remove('show');
  navEl('navEtaMin').textContent='已抵達';
  navEl('navEtaSub').textContent=new Date().toLocaleTimeString('zh-TW',{hour:'numeric',minute:'2-digit'})+' 抵達，5 秒後結束導航';
  navEl('navSpeed').textContent='0';
  setTimeout(()=>{if(driving&&nav?.arrived)stopDriving();},5000);
}

// ── 模擬行駛（示範模式）：依各路段的實際車速（已含事件與時段）沿路線前進
function simTick(){
  if(!driving||!driveSim||!nav)return;
  const now=performance.now(),dt=Math.min(1,(now-simLast)/1000);simLast=now;
  if(!simPlaying||rerouting||nav.arrived){currentSpeed=0;if(!nav.arrived)renderNavHud();return;}
  const e=nav.E[navIdx];
  const v=e&&e.travel_min>0?e.length_km/(e.travel_min/60):30;
  currentSpeed=v;
  navS=Math.min(nav.total,navS+v*dt*simFactor/3600);
  navUpdate(true);
}
function toggleSim(){simPlaying=!simPlaying;simLast=performance.now();updateSimButtons();}
function setSimFactor(f){simFactor=f;updateSimButtons();}
function updateSimButtons(){
  navEl('simPlay').textContent=simPlaying?'暫停':'繼續';
  document.querySelectorAll('#navSim [data-f]').forEach(b=>b.classList.toggle('on',+b.dataset.f===simFactor));
}

function startDriving(){
  if(!latestRoute?.edges?.length){showMsg('請先查詢路線','err');return;}
  nav=buildNav(latestRoute);navS=0;navIdx=0;navDoneIdx=0;
  let farKm=Infinity;
  if(gpsCoord){const sn=navSnap(gpsCoord.lat,gpsCoord.lon);farKm=sn.d;if(farKm<=SIM_FAR_KM)navS=sn.s;}
  const fe=latestRoute.edges[0];
  driveSim=farKm>SIM_FAR_KM?{lat:fe.lat_a,lon:fe.lon_a}:null;
  driving=true;driveFollowing=true;currentSpeed=0;offRouteCount=0;
  document.body.classList.add('driving');
  document.body.classList.remove('nav-arrived');
  styleDriveRoute();
  setHeadingUp(true);
  const p=navPoint(navS);
  map.setView([p.lat,p.lon],NAV_ZOOM,{animate:false});
  if(gpsMarker&&map.hasLayer(gpsMarker))map.removeLayer(gpsMarker);
  if(gpsCircle&&map.hasLayer(gpsCircle))map.removeLayer(gpsCircle);
  gpsMarker=L.marker([p.lat,p.lon],{interactive:false,zIndexOffset:1000,
    icon:L.divIcon({className:'nav-car',iconSize:[44,44],iconAnchor:[22,22],html:CAR_SVG})}).addTo(map);
  navEl('navRecenter').classList.remove('show');
  navEl('navSim').classList.toggle('show',!!driveSim);
  navUpdate(false);
  clearInterval(simTimer);simTimer=null;
  if(driveSim){
    simPlaying=true;simLast=performance.now();updateSimButtons();
    simTimer=setInterval(simTick,200);
    notify(gpsCoord?`目前位置距離路線 ${farKm.toFixed(0)} 公里，以模擬行駛示範導航`
                   :'未取得定位，以模擬行駛示範導航');
  }
}

function stopDriving(){
  clearInterval(simTimer);simTimer=null;simPlaying=false;
  driving=false;driveFollowing=true;nav=null;navS=0;navIdx=0;navDoneIdx=0;
  currentSpeed=0;lastGpsCoord=null;lastGpsTime=0;offRouteCount=0;rerouting=false;
  driveSim=null;currentBearing=0;gpsMovingBearing=null;
  setHeadingUp(false);
  if(gpsMarker&&map.hasLayer(gpsMarker))map.removeLayer(gpsMarker);
  gpsMarker=null;
  document.body.classList.remove('driving','nav-arrived');
  if(routeL){
    if(routeL._outline)routeL._outline.eachLayer(l=>l.setStyle({color:'#1a1a2e',weight:9,opacity:0.6}));
    routeL.eachLayer(layer=>{
      if(layer.feature){
        const hw=layer.feature.properties?.highway||'';
        const c={'motorway':'#00bfff','trunk':'#00e676','primary':'#ffa726',
                  'secondary':'#ab47bc','tertiary':'#78909c'}[hw]||'#5c8ab5';
        layer.setStyle({color:c,opacity:1,weight:6});
      }
    });
    const b=routeL.getBounds();if(b.isValid())map.fitBounds(b.pad(.08));
  }
  else map.setZoom(12);
}

function driveRecenter(){
  driveFollowing=true;
  navEl('navRecenter').classList.remove('show');
  if(map.getZoom()<15)map.setZoom(NAV_ZOOM,{animate:false});
  navUpdate(false);
}

function navOverview(){
  // 路線概覽：北朝上、看整條路線；按「重新置中」回到跟車
  driveFollowing=false;currentBearing=0;
  document.getElementById('map').style.transform='';
  navEl('navRecenter').classList.add('show');
  if(routeL){const b=routeL.getBounds();if(b.isValid())map.fitBounds(b.pad(.12),{animate:false});}
}

async function reroute(lat,lon,why=''){
  if(rerouting||!endCoord)return;
  rerouting=true;
  notify(`${why}重新計算路線...`);
  const prev=latestRoute;
  try{
    const d=await call('/route',{method:'POST',body:JSON.stringify({
      start_lat:lat,start_lon:lon,end_lat:endCoord.lat,end_lon:endCoord.lon,mode
    })});
    latestRoute=d;
    renderRoute(d,{fit:false});
    styleDriveRoute();
    if(driving){
      nav=buildNav(d);navIdx=0;navDoneIdx=0;offRouteCount=0;
      navS=(!driveSim&&gpsCoord)?navSnap(gpsCoord.lat,gpsCoord.lon).s:0;
      navUpdate(false);
    }
    notify(`${why}已重新規劃：${routeDiffText(prev,d)}`,'ok');
  }catch(e){notify('重新規劃失敗：'+e.message,'err');}
  rerouting=false;
}

function routeDiffText(prev,d){
  const now=`${d.total_km.toFixed(1)} km · ${d.total_min.toFixed(0)} 分鐘`;
  if(!prev)return now;
  return `${prev.total_km.toFixed(1)} → ${d.total_km.toFixed(1)} km · `+
         `${prev.total_min.toFixed(0)} → ${d.total_min.toFixed(0)} 分鐘`;
}

// 事件有變動（新增、刪除、預測更新）時，已查好的路線自動重新規劃
let refreshPending=false;
async function refreshRouteForEvents(){
  if(!latestRoute)return;
  if(rerouting){refreshPending=true;return;}   // 正在算：算完再補一次，不漏掉這次變化
  if(driving){
    const p=drivePos();
    if(p&&!nav?.arrived)await reroute(p.lat,p.lon,'路況變化，');
  }else if(startCoord&&endCoord){
    rerouting=true;
    const prev=latestRoute;
    try{
      const d=await call('/route',{method:'POST',body:JSON.stringify({
        start_lat:startCoord.lat,start_lon:startCoord.lon,end_lat:endCoord.lat,end_lon:endCoord.lon,
        mode,alternatives:true
      })});
      latestRoute=d;
      renderRoute(d,{fit:false});              // 不移動使用者目前的視角
      const changed=Math.abs(d.total_km-prev.total_km)>=0.05||Math.abs(d.total_min-prev.total_min)>=0.5;
      if(changed)notify(`路況變化，已重新規劃：${routeDiffText(prev,d)}`,'ok');
    }catch(e){notify('路況變化後重新規劃失敗：'+e.message,'err');}
    finally{rerouting=false;}
  }
  if(refreshPending){refreshPending=false;refreshRouteForEvents();}
}

function distBetween(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcBearing(lat1,lon1,lat2,lon2){
  const toRad=v=>v*Math.PI/180;
  const dLon=toRad(lon2-lon1);
  const y=Math.sin(dLon)*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}

function applyMapRotation(newBearing){
  let diff=newBearing-currentBearing;
  if(diff>180)diff-=360; if(diff<-180)diff+=360;
  if(Math.abs(diff)<3)return;
  currentBearing=(currentBearing+diff+360)%360;
  // 地圖已由 setHeadingUp 放大成對角線大小，只需旋轉
  document.getElementById('map').style.transform=`rotate(${-currentBearing}deg)`;
}

function onDriveGpsUpdate(){
  if(!driving||!gpsCoord||!nav||nav.arrived)return;
  const now=Date.now();
  if(lastGpsCoord&&lastGpsTime){
    const dt=(now-lastGpsTime)/1000;
    if(dt>0){
      const d=distBetween(lastGpsCoord.lat,lastGpsCoord.lon,gpsCoord.lat,gpsCoord.lon);
      currentSpeed=d/dt*3600;
      if(currentSpeed>200)currentSpeed=0;
    }
  }
  lastGpsCoord={...gpsCoord};
  lastGpsTime=now;
  const sn=navSnap(gpsCoord.lat,gpsCoord.lon);
  if(sn.d>0.08){
    if(++offRouteCount>=3){offRouteCount=0;reroute(gpsCoord.lat,gpsCoord.lon,'偏離路線，');return;}
  }else offRouteCount=0;
  if(sn.s>=navS-0.05)navS=sn.s;              // 定位抖動時不倒退
  navUpdate(true);
}

map.on('dragstart',()=>{
  if(driving){
    driveFollowing=false;
    currentBearing=0; gpsMovingBearing=null;
    document.getElementById('map').style.transform='';
    navEl('navRecenter').classList.add('show');
  }
});

// Layers
const overlayState={congestion:true,events:true,weather:true,prediction:true};
const overlayGroups={congestion:L.layerGroup().addTo(map),events:L.layerGroup().addTo(map),weather:L.layerGroup().addTo(map),prediction:L.layerGroup().addTo(map)};

function toggleLayerPanel(){document.getElementById('layerDrop').classList.toggle('show');}
function toggleLayer(name){
  overlayState[name]=!overlayState[name];
  event.currentTarget.classList.toggle('on',overlayState[name]);
  if(overlayState[name])map.addLayer(overlayGroups[name]);else map.removeLayer(overlayGroups[name]);
}
function sevColor(sev){
  if(sev>=0.8)return'#ff2222';if(sev>=0.6)return'#ff6600';
  if(sev>=0.4)return'#ffaa00';if(sev>=0.2)return'#ffdd00';return'#88cc00';
}
const evtColors={accident:'#ff4444',construction:'#ffb400',closure:'#cc0000',congestion:'#ff6600',manual:'#a78bfa'};

// ── 新事件通知 ──────────────────────────────────────────
let knownEventIds=null;   // null = 首次載入（只記錄不通知）
const EVT_ICON={accident:'🚗💥',construction:'🚧',closure:'⛔',congestion:'🐢',manual:'📍'};
function showToast(html,cls='',ms=9000,onClick=null){
  const stack=document.getElementById('toastStack');
  const t=document.createElement('div');t.className=`toast ${cls}`;t.innerHTML=html;
  t.onclick=()=>{if(onClick)onClick();dismiss();};stack.appendChild(t);
  let gone=false;
  function dismiss(){if(gone)return;gone=true;t.classList.add('hide');setTimeout(()=>t.remove(),450);}
  setTimeout(dismiss,ms);
}
async function placeName(lat,lon){
  try{const r=await call(`/revgeocode?lat=${lat}&lon=${lon}`);return r.name||'';}catch(e){return'';}
}
async function notifyNewEvents(events){
  const ids=new Set(events.map(e=>e.event_id||e.id||`${e.lat},${e.lon},${e.event_type}`));
  if(knownEventIds===null){knownEventIds=ids;return;}
  const fresh=events.filter(e=>!knownEventIds.has(e.event_id||e.id||`${e.lat},${e.lon},${e.event_type}`));
  knownEventIds=ids;
  if(!fresh.length)return;
  const preds=fresh.filter(e=>e.source==='prediction');
  const others=fresh.filter(e=>e.source!=='prediction');
  if(preds.length)   // 預測批次（一次 26 個）合併成一則
    showToast(`<b>🔮 預測更新</b>：新增 ${preds.length} 個預測壅塞路段，路線將自動反映`,'pred');
  for(const ev of others.slice(0,3)){
    const sev=+ev.severity||0.5,lat=+ev.lat,lon=+ev.lon;
    const loc=await placeName(lat,lon);          // 反向地理編碼取地點名
    const locLine=loc?`📍 ${loc}`:`📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    showToast(`<b>${EVT_ICON[ev.event_type]||'⚠️'} 新事件：${ev.event_type}</b><br>`+
      `${locLine}<br>${(ev.description||'').slice(0,60)}<br>`+
      `嚴重度 ${sev.toFixed(2)}<span style="color:#8ab4ff">　· 點擊查看位置</span>`,
      '',12000,()=>map.setView([lat,lon],14));
  }
  if(others.length>3)showToast(`⚠️ 另有 ${others.length-3} 個新事件，見地圖圖層`);
}

let lastEventIds=null, lastCostVersion=null, lastOverlaySig='';
async function loadOverlays(){
  try{
    const[events,weather,ver]=await Promise.all([call('/events'),call('/weather'),
                                                 call('/dynamic/version').catch(()=>null)]);
    notifyNewEvents(events);

    // 路網成本更新完成（新增事件套用完、刪除後重算完、預測更新）→ 已查好的路線重新規劃；
    // 事件清單變動也觸發（例如背景同步直接重算，不經版本號）
    const evIds=events.map(e=>e.event_id).sort().join(',');
    const v=ver?ver.version:null;
    if((lastCostVersion!==null&&v!==lastCostVersion)||(lastEventIds!==null&&evIds!==lastEventIds))
      refreshRouteForEvents();
    lastEventIds=evIds; lastCostVersion=v;

    const sig=JSON.stringify([events,weather]);   // 沒有變化就不重畫（重畫會關掉已開啟的說明框）
    if(sig===lastOverlaySig)return;
    lastOverlaySig=sig;

    overlayGroups.congestion.clearLayers();overlayGroups.events.clearLayers();overlayGroups.weather.clearLayers();overlayGroups.prediction.clearLayers();
    let cC=0,cE=0,cP=0;
    for(const ev of events){
      const lat=+ev.lat,lon=+ev.lon,sev=+ev.severity||0.5,rad=(+ev.radius_km||0.5)*1000;
      if(!lat||!lon)continue;
      if(ev.source==='prediction'){
        // GCN 預測壅塞：獨立圖層 + 雙圈視覺（外虛線圈 + 內實心核），嚴重度越高越不透明
        cP++;
        const op=Math.min(.45,.15+sev*.3);
        L.circle([lat,lon],{radius:rad,fillColor:'#b388ff',color:'#7c4dff',weight:2.5,dashArray:'6 4',fillOpacity:op,opacity:.85})
          .addTo(overlayGroups.prediction);
        L.circleMarker([lat,lon],{radius:5,fillColor:'#7c4dff',color:'#fff',weight:1.5,fillOpacity:.95})
          .bindPopup(`<b>🔮 GCN 預測壅塞</b><br>${ev.description||''}<br>嚴重度 ${sev.toFixed(2)}（T-GCN 30 分鐘預測）<br><span style="color:#888;font-size:11px">路線已自動反映此預測</span>`)
          .addTo(overlayGroups.prediction);
      }else if(ev.event_type==='congestion'&&ev.source==='realtime'){
        cC++;
        L.circleMarker([lat,lon],{radius:4,fillColor:sevColor(sev),color:'rgba(0,0,0,.3)',weight:1,fillOpacity:.8})
          .bindPopup(`壅塞 sev=${sev.toFixed(2)}`).addTo(overlayGroups.congestion);
      }else{
        cE++;const col=evtColors[ev.event_type]||'#a78bfa';
        L.circle([lat,lon],{radius:rad,fillColor:col,color:col,weight:1.5,fillOpacity:.15,opacity:.5})
          .bindPopup(`${ev.event_type} sev=${sev.toFixed(2)}`).addTo(overlayGroups.events);
      }
    }
    let cW=0;
    for(const wx of weather){
      const lat=+wx.lat,lon=+wx.lon,rad=(+wx.radius_km||30)*1000;
      const rain=+wx.rain_level||0,wind=+wx.wind_level||0,vis=+wx.visibility_level||0;
      const mx=Math.max(rain,wind,vis);if(mx<0.01)continue;cW++;
      const col=rain>=wind&&rain>=vis?'#2288ff':wind>=vis?'#44bb88':'#888';
      L.circle([lat,lon],{radius:rad,fillColor:col,color:col,weight:1,fillOpacity:Math.min(.12,mx*.15),opacity:.25})
        .addTo(overlayGroups.weather);
    }
    document.getElementById('olCong').textContent=cC;
    document.getElementById('olEvt').textContent=cE;
    document.getElementById('olWx').textContent=cW;
    document.getElementById('olPred').textContent=cP;
  }catch(e){}
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.layer-btn')&&!e.target.closest('.layer-dropdown'))
    document.getElementById('layerDrop').classList.remove('show');
});

// Init
setupSearch('inputStart','sugStart',(lat,lon,label)=>setStart(lat,lon,label));
setupSearch('inputEnd','sugEnd',(lat,lon,label)=>setEnd(lat,lon,label));
ping();initGps();loadOverlays();
setInterval(ping,30000);setInterval(loadOverlays,5000);    // 5s：新事件與路線重新規劃的即時性（沒變化就不重畫）
</script>
