<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>台灣動態導航</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#060d1a;--surf:rgba(11,22,40,.92);--surf2:rgba(16,31,53,.95);--border:#192c47;
  --accent:#00d4ff;--acc2:#0099cc;--green:#00e5a0;--amber:#ffb400;
  --red:#ff4444;--text:#cde4f5;--muted:#4a6d99;
  --mono:'JetBrains Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif;
  --radius:12px;--panel-w:340px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}

#map{position:fixed;inset:0;z-index:0}

/* Route Panel (top-left) */
.route-panel{
  position:fixed;top:16px;left:16px;z-index:600;
  width:var(--panel-w);background:var(--surf);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.rp-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rp-header h1{font-family:var(--cond);font-size:18px;font-weight:700;color:var(--accent);flex:1}
.rp-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.3s}
.rp-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.rp-dot.off{background:var(--red)}

.search-group{position:relative;margin-bottom:8px}
.search-row{display:flex;gap:6px;align-items:center}
.search-input{
  flex:1;background:rgba(6,13,26,.7);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:14px;color:var(--text);outline:none;transition:.15s;
  font-family:var(--sans);
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.loc-btn{
  width:36px;height:36px;border-radius:8px;background:rgba(6,13,26,.7);
  border:1px solid var(--border);color:var(--accent);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;
}
.loc-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}

.suggestions{
  position:absolute;top:100%;left:0;right:0;z-index:700;
  background:rgba(11,22,40,.97);border:1px solid var(--border);border-radius:8px;
  margin-top:4px;max-height:200px;overflow-y:auto;display:none;
}
.suggestions.show{display:block}
.sug-item{
  padding:10px 12px;font-size:13px;color:var(--text);cursor:pointer;
  border-bottom:1px solid rgba(25,44,71,.5);transition:.1s;
}
.sug-item:last-child{border-bottom:none}
.sug-item:hover{background:rgba(0,212,255,.1)}
.sug-item .sug-src{font-size:10px;color:var(--muted);margin-left:6px}

.mode-pills{display:flex;gap:4px;margin:10px 0}
.pill{
  flex:1;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:600;
  font-family:var(--cond);cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);transition:.15s;user-select:none;
}
.pill.active{background:var(--accent);border-color:var(--accent);color:#000}
.pill:hover:not(.active){border-color:var(--accent);color:var(--accent)}

.nav-btn{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:var(--accent);color:#000;font-family:var(--cond);
  font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:.15s;
}
.nav-btn:hover{background:var(--acc2)}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}

.rp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.rp-footer a{font-size:11px;color:var(--muted);text-decoration:none}
.rp-footer a:hover{color:var(--accent)}
.rp-msg{font-size:11px;margin-top:6px;padding:5px 8px;border-radius:6px;font-family:var(--mono);display:none}
.rp-msg.ok{background:#001f14;color:var(--green);border:1px solid #00402a;display:block}
.rp-msg.err{background:#200000;color:var(--red);border:1px solid #500000;display:block}
.rp-msg.info{background:#001428;color:var(--accent);border:1px solid #003355;display:block}

/* Layer Button (top-right) */
.layer-btn{
  position:fixed;top:16px;right:16px;z-index:600;
  width:40px;height:40px;border-radius:10px;background:var(--surf);backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--text);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.layer-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.layer-dropdown{
  position:fixed;top:62px;right:16px;z-index:600;
  background:var(--surf);backdrop-filter:blur(16px);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;min-width:180px;display:none;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.layer-dropdown.show{display:block}
.ld-item{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer;user-select:none}
.ld-dot{width:10px;height:10px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.ld-label{font-size:12px;color:var(--muted);flex:1}
.ld-item.on .ld-label{color:var(--text)}
.ld-count{font-family:var(--mono);font-size:11px;color:var(--accent)}

/* GPS Button (bottom-right) */
.gps-btn{
  position:fixed;bottom:30px;right:16px;z-index:600;
  width:44px;height:44px;border-radius:50%;background:var(--surf);backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--accent);font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.gps-btn:hover{background:var(--accent);color:#000}
.gps-btn.tracking{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.3)}

/* Result Panel (bottom) */
.result-panel{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:var(--surf2);backdrop-filter:blur(16px);border-top:1px solid var(--border);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:16px 20px;transform:translateY(100%);transition:transform .35s ease;
  max-height:45vh;overflow-y:auto;
}
.result-panel.show{transform:translateY(0)}
.rp-close{
  position:absolute;top:10px;right:16px;background:none;border:none;
  color:var(--muted);font-size:18px;cursor:pointer;width:auto;padding:4px;
}
.rp-close:hover{color:var(--text)}
.result-summary{display:flex;gap:20px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.rs-big{font-family:var(--cond);font-size:24px;font-weight:700;color:var(--accent)}
.rs-sub{font-size:13px;color:var(--muted)}
.result-steps{list-style:none}
.result-steps li{
  padding:8px 0;border-bottom:1px solid rgba(25,44,71,.4);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.result-steps li:last-child{border-bottom:none}
.step-icon{width:24px;height:24px;border-radius:6px;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent);flex-shrink:0}
.step-name{flex:1;color:var(--text)}
.step-dist{font-family:var(--mono);font-size:11px;color:var(--muted)}
.result-actions{display:flex;gap:8px;margin-top:12px}
.ra-btn{
  padding:8px 16px;border-radius:8px;font-size:12px;font-family:var(--cond);
  font-weight:600;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--muted);width:auto;transition:.15s;
}
.ra-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Legend */
.legend{
  position:fixed;bottom:30px;left:16px;z-index:400;
  background:var(--surf);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:11px;color:var(--muted);
  font-family:var(--mono);line-height:1.8;
}
.legend b{color:var(--text)}

/* Loading */
#loader{display:none;position:fixed;inset:0;background:rgba(6,13,26,.75);z-index:999;
  align-items:center;justify-content:center;flex-direction:column;gap:14px}
#loader.show{display:flex}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-family:var(--cond);font-size:16px;color:var(--accent)}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.8)}}
.gps-pulse{animation:pulse 2s ease-in-out infinite}

/* Heading-up rotation */
#map.heading-up{transform-origin:center center;transition:transform 0.6s ease-out}
.gps-arrow-svg{transition:transform 0.3s ease-out}

/* Driving Mode */
body.driving .route-panel,
body.driving .layer-btn,
body.driving .layer-dropdown,
body.driving .legend,
body.driving .result-panel,
body.driving .gps-btn{display:none!important}

.drive-hud{display:none;position:fixed;inset:0;z-index:800;pointer-events:none}
body.driving .drive-hud{display:block}

.drive-top{
  position:absolute;top:0;left:0;right:0;pointer-events:auto;
  background:linear-gradient(180deg,rgba(6,13,26,.95) 0%,rgba(6,13,26,.8) 80%,transparent 100%);
  padding:16px 20px 28px;
}
.drive-road{font-family:var(--cond);font-size:28px;font-weight:700;color:#fff;margin-bottom:4px}
.drive-next{font-size:13px;color:var(--muted)}
.drive-next span{color:var(--accent)}
.drive-turn{font-size:17px;color:#00e5a0;margin-top:10px;font-weight:600;min-height:24px}
.drive-turn .turn-icon{font-size:24px;margin-right:4px;vertical-align:middle}

.drive-bottom{
  position:absolute;bottom:0;left:0;right:0;pointer-events:auto;
  background:linear-gradient(0deg,rgba(6,13,26,.95) 0%,rgba(6,13,26,.8) 80%,transparent 100%);
  padding:28px 20px 20px;display:flex;align-items:center;gap:16px;
}
.drive-stat{flex:1;text-align:center}
.drive-stat .ds-val{font-family:var(--cond);font-size:26px;font-weight:700;color:var(--accent)}
.drive-stat .ds-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.drive-stop{
  width:56px;height:56px;border-radius:50%;background:var(--red);border:none;
  color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;pointer-events:auto;
  box-shadow:0 4px 20px rgba(255,68,68,.4);transition:.15s;
}
.drive-stop:hover{background:#cc2222;transform:scale(1.05)}

.drive-recenter{
  position:absolute;bottom:100px;right:16px;pointer-events:auto;
  width:44px;height:44px;border-radius:50%;background:var(--surf);backdrop-filter:blur(12px);
  border:1px solid var(--border);color:var(--accent);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

@media(max-width:600px){
  .route-panel{top:8px;left:8px;right:8px;width:auto}
  .legend{display:none}
  .result-panel{max-height:55vh}
}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div class="ltxt" id="ltxt">路線計算中...</div></div>
<div id="map"></div>

<!-- Route Panel -->
<div class="route-panel">
  <div class="rp-header">
    <h1>台灣動態導航</h1>
    <div class="rp-dot" id="connDot"></div>
  </div>

  <div class="search-group">
    <div class="search-row">
      <input class="search-input" id="inputStart" placeholder="起點：地址、地標或座標" autocomplete="off"/>
      <button class="loc-btn" id="btnGpsStart" title="使用目前位置">📍</button>
    </div>
    <div class="suggestions" id="sugStart"></div>
  </div>

  <div class="search-group">
    <div class="search-row">
      <input class="search-input" id="inputEnd" placeholder="終點：地址、地標或座標" autocomplete="off"/>
    </div>
    <div class="suggestions" id="sugEnd"></div>
  </div>

  <div class="mode-pills">
    <div class="pill" data-mode="fastest" onclick="setMode('fastest')">⚡ 最快</div>
    <div class="pill active" data-mode="balanced" onclick="setMode('balanced')">⚖ 平衡</div>
    <div class="pill" data-mode="safest" onclick="setMode('safest')">🛡 安全</div>
  </div>

  <button class="nav-btn" onclick="navigate()">開始導航</button>
  <div class="rp-msg" id="rpMsg"></div>

  <div class="rp-footer">
    <span style="font-size:10px;color:var(--muted)">點地圖設定起終點</span>
    <a href="/admin">⚙ 管理</a>
  </div>
</div>

<!-- Layer Button -->
<button class="layer-btn" onclick="toggleLayerPanel()">🗂</button>
<div class="layer-dropdown" id="layerDrop">
  <div class="ld-item on" onclick="toggleLayer('congestion')">
    <div class="ld-dot" style="background:#ff4444"></div>
    <div class="ld-label">車速壅塞</div>
    <div class="ld-count" id="olCong">—</div>
  </div>
  <div class="ld-item on" onclick="toggleLayer('events')">
    <div class="ld-dot" style="background:#ffb400"></div>
    <div class="ld-label">交通事件</div>
    <div class="ld-count" id="olEvt">—</div>
  </div>
  <div class="ld-item on" onclick="toggleLayer('weather')">
    <div class="ld-dot" style="background:#4a9eff"></div>
    <div class="ld-label">天氣影響</div>
    <div class="ld-count" id="olWx">—</div>
  </div>
</div>

<!-- GPS Button -->
<button class="gps-btn" id="gpsBtn" onclick="centerGps()">⊕</button>

<!-- Legend -->
<div class="legend">
  <b>道路類型</b><br>
  <span style="color:#00d4ff">━</span> 高速公路<br>
  <span style="color:#00e5a0">━</span> 快速道路<br>
  <span style="color:#ffb400">━</span> 主要道路<br>
  <span style="color:#a78bfa">━</span> 次要道路<br>
  <span style="color:#6b7280">━</span> 其他
</div>

<!-- Driving HUD -->
<div class="drive-hud" id="driveHud">
  <div class="drive-top">
    <div class="drive-turn" id="driveTurn"></div>
    <div class="drive-road" id="driveRoad">—</div>
    <div class="drive-next">下一段 <span id="driveNext">—</span></div>
  </div>
  <button class="drive-recenter" onclick="driveRecenter()">⊕</button>
  <div class="drive-bottom">
    <div class="drive-stat"><div class="ds-val" id="driveRemKm">—</div><div class="ds-lbl">剩餘</div></div>
    <div class="drive-stat"><div class="ds-val" id="driveEta">—</div><div class="ds-lbl">預估到達</div></div>
    <div class="drive-stat"><div class="ds-val" id="driveSpeed">—</div><div class="ds-lbl">km/h</div></div>
    <button class="drive-stop" onclick="stopDriving()">■</button>
  </div>
</div>

<!-- Result Panel -->
<div class="result-panel" id="resultPanel">
  <button class="rp-close" onclick="closeResult()">✕</button>
  <div class="result-summary" id="resSummary"></div>
  <ul class="result-steps" id="resSteps"></ul>
  <div class="result-actions">
    <button class="ra-btn" onclick="startDriving()" style="background:var(--accent);color:#000;border-color:var(--accent);font-size:14px;padding:10px 20px">▶ 開始行駛</button>
    <button class="ra-btn" onclick="dlAnalysis()">下載分析</button>
    <button class="ra-btn" onclick="clearRoute()">清除路線</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API_BASE=(window.__API_BASE||location.origin).replace(/\/$/,'');
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let mode='balanced', clickPhase='start';
let startCoord=null, endCoord=null;
let startM=null, endM=null, routeL=null, latestRoute=null;
let gpsMarker=null, gpsCircle=null, watchId=null, gpsCoord=null;
let searchTimer=null;

const map=L.map('map',{zoomControl:false}).setView([23.7,121.0],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OSM',maxZoom:19}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

const mkIcon=color=>L.divIcon({className:'',iconAnchor:[8,8],
  html:`<div style="width:16px;height:16px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 8px ${color}80"></div>`});
const startIcon=mkIcon('#00e5a0'), endIcon=mkIcon('#ff4444');

map.on('click',e=>{
  const{lat,lng}=e.latlng;
  if(clickPhase==='start'){
    setStart(lat,lng,`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    clickPhase='end';
  }else{
    setEnd(lat,lng,`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    clickPhase='start';
  }
});

function setStart(lat,lon,label){
  startCoord={lat,lon};
  document.getElementById('inputStart').value=label;
  if(startM)map.removeLayer(startM);
  startM=L.marker([lat,lon],{icon:startIcon}).addTo(map).bindPopup('起點');
}
function setEnd(lat,lon,label){
  endCoord={lat,lon};
  document.getElementById('inputEnd').value=label;
  if(endM)map.removeLayer(endM);
  endM=L.marker([lat,lon],{icon:endIcon}).addTo(map).bindPopup('終點');
}

async function call(path,opts={}){
  const r=await fetch(API_BASE+path,{headers:{'Content-Type':'application/json'},...opts});
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json():await r.text();
  if(!r.ok)throw new Error(typeof body==='string'?`HTTP ${r.status}: ${body}`:(body.detail||`HTTP ${r.status}`));
  return body;
}
function showMsg(text,type='info'){
  const el=document.getElementById('rpMsg');el.textContent=text;el.className=`rp-msg ${type}`;
}
function hideMsg(){document.getElementById('rpMsg').className='rp-msg';}
function loading(show,text=''){
  const l=document.getElementById('loader');l.classList.toggle('show',show);
  if(text)document.getElementById('ltxt').textContent=text;
}

async function ping(){
  const dot=document.getElementById('connDot');
  try{await call('/stats');dot.className='rp-dot on';}
  catch(e){dot.className='rp-dot off';}
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.dataset.mode===m));
}

// Geocoding
function isCoordStr(s){
  const m=s.match(/^\s*(-?\d+\.?\d*)\s*[,，\s]\s*(-?\d+\.?\d*)\s*$/);
  if(!m)return null;
  const a=parseFloat(m[1]),b=parseFloat(m[2]);
  if(a>=21.5&&a<=26.5&&b>=118&&b<=122.5)return{lat:a,lon:b};
  if(b>=21.5&&b<=26.5&&a>=118&&a<=122.5)return{lat:b,lon:a};
  return null;
}

function setupSearch(inputId,sugId,onSelect){
  const input=document.getElementById(inputId);
  const sugBox=document.getElementById(sugId);

  input.addEventListener('input',()=>{
    clearTimeout(searchTimer);
    const q=input.value.trim();
    if(q.length<2){sugBox.classList.remove('show');return;}
    const coord=isCoordStr(q);
    if(coord){
      sugBox.innerHTML=`<div class="sug-item" data-lat="${coord.lat}" data-lon="${coord.lon}">📍 ${coord.lat.toFixed(5)}, ${coord.lon.toFixed(5)}<span class="sug-src">座標</span></div>`;
      sugBox.classList.add('show');
      return;
    }
    searchTimer=setTimeout(async()=>{
      try{
        const res=await call('/geocode?q='+encodeURIComponent(q));
        if(!res.length){sugBox.classList.remove('show');return;}
        sugBox.innerHTML=res.map(r=>
          `<div class="sug-item" data-lat="${escHtml(r.lat)}" data-lon="${escHtml(r.lon)}">${escHtml(r.name)}<span class="sug-src">${escHtml(r.source)}</span></div>`
        ).join('');
        sugBox.classList.add('show');
      }catch(e){sugBox.classList.remove('show');}
    },600);
  });

  input.addEventListener('focus',()=>{if(sugBox.children.length)sugBox.classList.add('show');});
  input.addEventListener('blur',()=>{setTimeout(()=>sugBox.classList.remove('show'),200);});

  sugBox.addEventListener('click',e=>{
    const item=e.target.closest('.sug-item');
    if(!item)return;
    const lat=parseFloat(item.dataset.lat),lon=parseFloat(item.dataset.lon);
    const label=item.childNodes[0].textContent.trim();
    onSelect(lat,lon,label);
    sugBox.classList.remove('show');
  });
}

// GPS
let gpsError=null;
function initGps(){
  if(!navigator.geolocation){gpsError='瀏覽器不支���定位';return;}
  navigator.geolocation.getCurrentPosition(
    pos=>onGpsPos(pos),
    err=>onGpsErr(err),
    {enableHighAccuracy:true,timeout:10000}
  );
  watchId=navigator.geolocation.watchPosition(
    pos=>onGpsPos(pos),
    err=>onGpsErr(err),
    {enableHighAccuracy:true,maximumAge:10000,timeout:15000}
  );
}
function onGpsPos(pos){
  const{latitude:lat,longitude:lng,accuracy,heading:gpsHeading,speed:gpsSpeed}=pos.coords;
  const prevGps=gpsCoord?{lat:gpsCoord.lat,lon:gpsCoord.lon}:null;
  gpsCoord={lat,lon:lng};
  gpsError=null;
  if(driving){
    if(gpsMarker)gpsMarker.setLatLng([lat,lng]);
    let bearing=null;
    if(gpsHeading!=null&&isFinite(gpsHeading)&&gpsSpeed>0.5) bearing=gpsHeading;
    else if(prevGps&&distBetween(prevGps.lat,prevGps.lon,lat,lng)>0.003)
      bearing=calcBearing(prevGps.lat,prevGps.lon,lat,lng);
    if(bearing!=null) gpsMovingBearing=bearing;
  }else{
    if(!gpsMarker){
      gpsMarker=L.circleMarker([lat,lng],{radius:7,fillColor:'#4a9eff',color:'#fff',weight:2,fillOpacity:1,className:'gps-pulse'});
      gpsCircle=L.circle([lat,lng],{radius:accuracy,fillColor:'#4a9eff',color:'#4a9eff',weight:1,fillOpacity:.08,opacity:.2});
    }else{
      gpsMarker.setLatLng([lat,lng]);
      if(gpsCircle)gpsCircle.setLatLng([lat,lng]).setRadius(accuracy);
    }
    if(map.hasLayer(gpsMarker)){map.removeLayer(gpsMarker);if(gpsCircle)map.removeLayer(gpsCircle);}
  }
  document.getElementById('gpsBtn').classList.add('tracking');
  if(driving) onDriveGpsUpdate();
}
function onGpsErr(err){
  document.getElementById('gpsBtn').classList.remove('tracking');
  if(err.code===1) gpsError='定位權限被拒���，請在瀏覽器允���位置存取';
  else if(err.code===2) gpsError='無法取得位置（GPS 無訊號）';
  else gpsError='定位��時，請重試';
}
function centerGps(){
  if(gpsCoord){map.setView([gpsCoord.lat,gpsCoord.lon],15);return;}
  if(gpsError){showMsg(gpsError,'err');return;}
  showMsg('定位���，請稍候...','info');
  navigator.geolocation.getCurrentPosition(
    pos=>{onGpsPos(pos);map.setView([gpsCoord.lat,gpsCoord.lon],15);hideMsg();},
    err=>{onGpsErr(err);showMsg(gpsError,'err');},
    {enableHighAccuracy:true,timeout:10000}
  );
}

document.getElementById('btnGpsStart').addEventListener('click',()=>{
  if(gpsCoord){setStart(gpsCoord.lat,gpsCoord.lon,'📍 目前位置');return;}
  if(gpsError){showMsg(gpsError,'err');return;}
  showMsg('正在取得位置...','info');
  navigator.geolocation.getCurrentPosition(
    pos=>{onGpsPos(pos);setStart(gpsCoord.lat,gpsCoord.lon,'📍 目前位置');hideMsg();},
    err=>{onGpsErr(err);showMsg(gpsError,'err');},
    {enableHighAccuracy:true,timeout:10000}
  );
});

// Navigate
async function navigate(){
  hideMsg();
  if(!startCoord){showMsg('請設定起點','err');return;}
  if(!endCoord){showMsg('請設定終點','err');return;}
  const{lat:sLat,lon:sLon}=startCoord,{lat:eLat,lon:eLon}=endCoord;
  if(sLat<21.5||sLat>26.5||sLon<118||sLon>122.5){showMsg('起點超出台灣範圍','err');return;}
  if(eLat<21.5||eLat>26.5||eLon<118||eLon>122.5){showMsg('終點超出台灣範圍','err');return;}

  loading(true,'A* 路徑計算中...');
  try{
    const d=await call('/route',{method:'POST',body:JSON.stringify({
      start_lat:sLat,start_lon:sLon,end_lat:eLat,end_lon:eLon,mode
    })});
    latestRoute=d;
    renderRoute(d);
    showMsg(`${d.total_km.toFixed(1)} km · ${d.total_min.toFixed(0)} 分鐘`,'ok');
  }catch(e){showMsg(e.message,'err');}
  finally{loading(false);}
}

function renderRoute(d){
  if(routeL){if(routeL._outline)map.removeLayer(routeL._outline);map.removeLayer(routeL);routeL=null;}
  if(d.geojson?.features?.length){
    const routeOutline=L.geoJSON(d.geojson,{
      style:()=>({color:'#1a1a2e',weight:9,opacity:0.6,lineCap:'round',lineJoin:'round'}),
      interactive:false
    }).addTo(map);
    routeL=L.geoJSON(d.geojson,{
      style:f=>{
        const hw=f.properties?.highway||'';
        const c={'motorway':'#00bfff','trunk':'#00e676','primary':'#ffa726',
                  'secondary':'#ab47bc','tertiary':'#78909c'}[hw]||'#5c8ab5';
        return{color:c,weight:6,opacity:1,lineCap:'round',lineJoin:'round'};
      },
      onEachFeature:(f,layer)=>{
        const p=f.properties||{};
        layer.bindPopup(`<b>${escHtml(p.name||p.highway||'—')}</b><br>${(p.length_km||0).toFixed(2)} km`);
      }
    }).addTo(map);
    routeL._outline=routeOutline;
    const b=routeL.getBounds();
    if(b.isValid())map.fitBounds(b.pad(.08));
  }

  const modeLabel={'fastest':'最快','balanced':'平衡','safest':'安全'}[d.mode]||d.mode;
  document.getElementById('resSummary').innerHTML=
    `<span class="rs-big">${d.total_km.toFixed(1)} km</span>
     <span class="rs-big">${d.total_min.toFixed(0)} 分鐘</span>
     <span class="rs-sub">${modeLabel}路線 · ${d.num_edges} 路段</span>`;

  const merged=[];
  let prev=null,km=0,mn=0;
  (d.edges||[]).forEach(e=>{
    const nm=e.name||e.highway||'—';
    if(nm===prev){km+=e.length_km||0;mn+=e.travel_min||0;}
    else{if(prev)merged.push({nm:prev,km,mn});prev=nm;km=e.length_km||0;mn=e.travel_min||0;}
  });
  if(prev)merged.push({nm:prev,km,mn});

  document.getElementById('resSteps').innerHTML=merged.slice(0,30).map((s,i)=>
    `<li><div class="step-icon">${i+1}</div><span class="step-name">${escHtml(s.nm)}</span><span class="step-dist">${s.km.toFixed(1)} km</span></li>`
  ).join('');

  document.getElementById('resultPanel').classList.add('show');
}

function closeResult(){document.getElementById('resultPanel').classList.remove('show');}
function clearRoute(){
  if(driving) stopDriving();
  if(routeL){if(routeL._outline)map.removeLayer(routeL._outline);map.removeLayer(routeL);routeL=null;}
  latestRoute=null;
  document.getElementById('resultPanel').classList.remove('show');
  hideMsg();
}
function dlAnalysis(){
  if(!latestRoute?.analysis_text){showMsg('無分析資料','err');return;}
  const a=Object.assign(document.createElement('a'),{
    href:URL.createObjectURL(new Blob([latestRoute.analysis_text],{type:'text/plain;charset=utf-8'})),
    download:`route_${new Date().toISOString().slice(0,10)}.txt`});
  document.body.appendChild(a);a.click();a.remove();
}

// ── Driving Mode
let driving=false, driveFollowing=true, driveEdges=[], driveEdgeIdx=0;
let lastGpsTime=0, lastGpsCoord=null, currentSpeed=0;
let offRouteCount=0, rerouting=false, lastEventHash='';
let currentBearing=0, gpsMovingBearing=null;

function buildDriveEdges(){
  if(!latestRoute?.edges) return[];
  const rawEdges=latestRoute.edges,merged=[];
  let prev=null,km=0,mn=0,rawStart=0;
  for(let i=0;i<rawEdges.length;i++){
    const e=rawEdges[i],nm=e.name||e.highway||'—';
    if(nm===prev){km+=e.length_km||0;mn+=e.travel_min||0;}
    else{if(prev!==null)merged.push({nm:prev,km,mn,rawStart,rawEnd:i-1});prev=nm;km=e.length_km||0;mn=e.travel_min||0;rawStart=i;}
  }
  if(prev!==null)merged.push({nm:prev,km,mn,rawStart,rawEnd:rawEdges.length-1});
  return merged;
}

function startDriving(){
  if(!latestRoute){showMsg('請先查詢路線','err');return;}
  if(!gpsCoord){showMsg('需要 GPS 定位才能行駛','err');return;}
  driveEdges=buildDriveEdges();
  if(!driveEdges.length)return;
  driveEdgeIdx=0;
  driving=true;
  driveFollowing=true;
  document.body.classList.add('driving');
  map.setView([gpsCoord.lat,gpsCoord.lon],16);
  // Replace circle marker with directional arrow
  if(gpsMarker&&map.hasLayer(gpsMarker))map.removeLayer(gpsMarker);
  if(gpsCircle&&map.hasLayer(gpsCircle))map.removeLayer(gpsCircle);
  gpsMarker=L.marker([gpsCoord.lat,gpsCoord.lon],{icon:L.divIcon({
    className:'',iconSize:[24,24],iconAnchor:[12,12],
    html:'<svg width="24" height="24" viewBox="0 0 24 24" class="gps-arrow-svg"><polygon points="12,2 4,20 12,16 20,20" fill="#4a9eff" stroke="#fff" stroke-width="1.5"/></svg>'
  })}).addTo(map);
  document.getElementById('map').classList.add('heading-up');
  const fe=latestRoute.edges[0];
  if(fe?.lat_a!=null&&fe?.lat_b!=null)applyMapRotation(calcBearing(fe.lat_a,fe.lon_a,fe.lat_b,fe.lon_b));
  updateDriveHud();
}

function stopDriving(){
  driving=false;
  driveFollowing=true;
  driveEdgeIdx=0;
  driveEdges=[];
  currentSpeed=0;
  lastGpsCoord=null;
  lastGpsTime=0;
  offRouteCount=0;
  rerouting=false;
  lastEventHash='';
  currentBearing=0; gpsMovingBearing=null;
  const mapEl=document.getElementById('map');
  mapEl.style.transform='';
  mapEl.classList.remove('heading-up');
  if(gpsMarker&&map.hasLayer(gpsMarker))map.removeLayer(gpsMarker);
  gpsMarker=null;
  document.body.classList.remove('driving');
  document.getElementById('driveTurn').textContent='';
  if(routeL){
    if(routeL._outline)routeL._outline.eachLayer(l=>l.setStyle({opacity:0.6}));
    routeL.eachLayer(layer=>{
      if(layer.feature){
        const hw=layer.feature.properties?.highway||'';
        const c={'motorway':'#00bfff','trunk':'#00e676','primary':'#ffa726',
                  'secondary':'#ab47bc','tertiary':'#78909c'}[hw]||'#5c8ab5';
        layer.setStyle({color:c,opacity:1,weight:6});
      }
    });
    const b=routeL.getBounds();if(b.isValid())map.fitBounds(b.pad(.08));
  }
  else map.setZoom(12);
}

function driveRecenter(){
  driveFollowing=true;
  if(gpsCoord){
    applyMapRotation(getRouteBearing());
    map.setView([gpsCoord.lat,gpsCoord.lon],16);
  }
}

async function reroute(lat,lon){
  if(rerouting||!endCoord)return;
  rerouting=true;
  showMsg('重新計算路線...','info');
  try{
    const d=await call('/route',{method:'POST',body:JSON.stringify({
      start_lat:lat,start_lon:lon,end_lat:endCoord.lat,end_lon:endCoord.lon,mode
    })});
    latestRoute=d;
    renderRoute(d);
    driveEdges=buildDriveEdges();
    driveEdgeIdx=0;
    offRouteCount=0;
    showMsg(`已重新路由：${d.total_km.toFixed(1)}km / ${d.total_min.toFixed(0)}min`,'ok');
  }catch(e){showMsg('重路由失敗','err');}
  rerouting=false;
}

function distBetween(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function calcBearing(lat1,lon1,lat2,lon2){
  const toRad=v=>v*Math.PI/180;
  const dLon=toRad(lon2-lon1);
  const y=Math.sin(dLon)*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2))-Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}

function getRouteBearing(){
  if(gpsMovingBearing!=null) return gpsMovingBearing;
  if(!latestRoute?.edges?.length||!gpsCoord)return currentBearing;
  const snap=findCurrentEdge(gpsCoord.lat,gpsCoord.lon);
  const e=latestRoute.edges[snap.rawIdx];
  if(!e?.lat_a||!e?.lat_b)return currentBearing;
  return calcBearing(e.lat_a,e.lon_a,e.lat_b,e.lon_b);
}

function applyMapRotation(newBearing){
  let diff=newBearing-currentBearing;
  if(diff>180)diff-=360; if(diff<-180)diff+=360;
  if(Math.abs(diff)<3)return;
  currentBearing=(currentBearing+diff+360)%360;
  const rad=currentBearing*Math.PI/180;
  const s=Math.abs(Math.cos(rad))+Math.abs(Math.sin(rad));
  document.getElementById('map').style.transform=
    `rotate(${-currentBearing}deg) scale(${s.toFixed(4)})`;
  if(gpsMarker){
    const el=gpsMarker.getElement?.();
    if(el){el.style.transform=`rotate(${currentBearing}deg)`;el.style.transformOrigin='center center';}
  }
}

function getTurnInstruction(prevEdge,nextEdge){
  if(!prevEdge||!nextEdge)return{icon:'⬆',text:'直行'};
  const b1=calcBearing(prevEdge.lat_a,prevEdge.lon_a,prevEdge.lat_b,prevEdge.lon_b);
  const b2=calcBearing(nextEdge.lat_a,nextEdge.lon_a,nextEdge.lat_b,nextEdge.lon_b);
  let turn=((b2-b1)+360)%360;
  if(turn>180)turn-=360;
  if(Math.abs(turn)<25)return{icon:'⬆',text:'直行'};
  if(turn>=25&&turn<70)return{icon:'↗',text:'微右轉'};
  if(turn>=70&&turn<150)return{icon:'➡',text:'右轉'};
  if(turn>=150)return{icon:'↩',text:'迴轉'};
  if(turn<=-25&&turn>-70)return{icon:'↖',text:'微左轉'};
  if(turn<=-70&&turn>-150)return{icon:'⬅',text:'左轉'};
  return{icon:'↩',text:'迴轉'};
}

function findCurrentEdge(lat,lon){
  if(!latestRoute?.edges?.length)return{idx:0,dist:Infinity,rawIdx:0};
  let bestIdx=0, bestDist=Infinity, bestRaw=0;
  const rawEdges=latestRoute.edges;
  const merged=driveEdges;
  let mIdx=0;
  for(let i=0;i<rawEdges.length;i++){
    const e=rawEdges[i];
    const eLat=e.lat_a||lat, eLon=e.lon_a||lon;
    const d=distBetween(lat,lon,eLat,eLon);
    const nm=e.name||e.highway||'—';
    if(mIdx<merged.length&&merged[mIdx].nm===nm){
      if(d<bestDist){bestDist=d;bestIdx=mIdx;bestRaw=i;}
    }
    if(i<rawEdges.length-1){
      const next=rawEdges[i+1];
      const nextNm=next.name||next.highway||'—';
      if(nextNm!==nm)mIdx++;
    }
  }
  return{idx:bestIdx,dist:bestDist,rawIdx:bestRaw};
}

function updateDriveHud(){
  if(!driving||!driveEdges.length)return;
  const cur=driveEdges[driveEdgeIdx]||driveEdges[0];
  const next=driveEdges[driveEdgeIdx+1];
  const rawEdges=latestRoute?.edges||[];

  document.getElementById('driveRoad').textContent=cur.nm;
  document.getElementById('driveNext').textContent=next?`${next.nm}（${next.km.toFixed(1)} km）`:'即將到達終點';

  const turnEl=document.getElementById('driveTurn');
  if(next&&cur.rawEnd!=null&&next.rawStart!=null){
    const prevRaw=rawEdges[cur.rawEnd],nextRaw=rawEdges[next.rawStart];
    const turn=getTurnInstruction(prevRaw,nextRaw);
    const rawDist=gpsCoord&&nextRaw?distBetween(gpsCoord.lat,gpsCoord.lon,nextRaw.lat_a,nextRaw.lon_a):cur.km;
    const distStr=rawDist>=1?`${rawDist.toFixed(1)}km`:`${Math.round(rawDist*1000)}m`;
    turnEl.innerHTML=`<span class="turn-icon">${turn.icon}</span> ${distStr} 後${turn.text}`;
  }else{
    turnEl.textContent=next?'':'🏁 即將到達';
  }

  let remKm=0,remMin=0;
  for(let i=driveEdgeIdx;i<driveEdges.length;i++){
    remKm+=driveEdges[i].km;
    remMin+=driveEdges[i].mn;
  }
  document.getElementById('driveRemKm').textContent=remKm>=1?`${remKm.toFixed(1)} km`:`${(remKm*1000).toFixed(0)} m`;

  const now=new Date();
  const eta=new Date(now.getTime()+remMin*60000);
  document.getElementById('driveEta').textContent=eta.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('driveSpeed').textContent=Math.round(currentSpeed);
}

function updateRouteProgress(newIdx){
  if(!routeL||!driveEdges[newIdx])return;
  const greyUpTo=driveEdges[newIdx].rawStart;
  let i=0;
  routeL.eachLayer(layer=>{
    if(i<greyUpTo)layer.setStyle({color:'#888',opacity:0.4,weight:4});
    i++;
  });
}

function onDriveGpsUpdate(){
  if(!driving||!gpsCoord)return;
  const now=Date.now();
  if(lastGpsCoord&&lastGpsTime){
    const dt=(now-lastGpsTime)/1000;
    if(dt>0){
      const d=distBetween(lastGpsCoord.lat,lastGpsCoord.lon,gpsCoord.lat,gpsCoord.lon);
      currentSpeed=d/dt*3600;
      if(currentSpeed>200)currentSpeed=0;
    }
  }
  lastGpsCoord={...gpsCoord};
  lastGpsTime=now;

  const snap=latestRoute?.edges?.length?findCurrentEdge(gpsCoord.lat,gpsCoord.lon):{idx:0,dist:Infinity};

  if(!snap||snap.dist>0.08){
    offRouteCount++;
    if(offRouteCount>=3){
      offRouteCount=0;
      reroute(gpsCoord.lat,gpsCoord.lon);
      return;
    }
  }else{
    offRouteCount=0;
  }

  if(snap.idx>=driveEdgeIdx){
    if(snap.idx>driveEdgeIdx)updateRouteProgress(snap.idx);
    driveEdgeIdx=snap.idx;
  }

  if(driveFollowing){
    applyMapRotation(getRouteBearing());
    map.setView([gpsCoord.lat,gpsCoord.lon],Math.max(map.getZoom(),15));
  }

  if(endCoord){
    const distToEnd=distBetween(gpsCoord.lat,gpsCoord.lon,endCoord.lat,endCoord.lon);
    if(distToEnd<0.05){
      showMsg('已到達目的地！','ok');
      document.getElementById('driveRoad').textContent='🏁 已到達目的地';
      document.getElementById('driveNext').textContent='';
      document.getElementById('driveTurn').textContent='';
      document.getElementById('driveRemKm').textContent='0';
      document.getElementById('driveEta').textContent='--:--';
      setTimeout(()=>stopDriving(),3000);
      return;
    }
  }
  updateDriveHud();
}

map.on('dragstart',()=>{
  if(driving){
    driveFollowing=false;
    currentBearing=0; gpsMovingBearing=null;
    document.getElementById('map').style.transform='';
  }
});

// Layers
const overlayState={congestion:true,events:true,weather:true};
const overlayGroups={congestion:L.layerGroup().addTo(map),events:L.layerGroup().addTo(map),weather:L.layerGroup().addTo(map)};

function toggleLayerPanel(){document.getElementById('layerDrop').classList.toggle('show');}
function toggleLayer(name){
  overlayState[name]=!overlayState[name];
  event.currentTarget.classList.toggle('on',overlayState[name]);
  if(overlayState[name])map.addLayer(overlayGroups[name]);else map.removeLayer(overlayGroups[name]);
}
function sevColor(sev){
  if(sev>=0.8)return'#ff2222';if(sev>=0.6)return'#ff6600';
  if(sev>=0.4)return'#ffaa00';if(sev>=0.2)return'#ffdd00';return'#88cc00';
}
const evtColors={accident:'#ff4444',construction:'#ffb400',closure:'#cc0000',congestion:'#ff6600',manual:'#a78bfa'};

async function loadOverlays(){
  try{
    const[events,weather]=await Promise.all([call('/events'),call('/weather')]);

    if(driving&&latestRoute&&gpsCoord&&!rerouting){
      const evHash=JSON.stringify(events.map(e=>e.id||`${e.lat},${e.lon}`).sort());
      if(lastEventHash&&evHash!==lastEventHash){
        const startRaw=driveEdges[driveEdgeIdx]?.rawStart||0;
        const remaining=latestRoute.edges.slice(startRaw);
        const onRoute=events.filter(ev=>{
          if(!ev.lat||!ev.lon)return false;
          const rad=+(ev.radius_km||0.5);
          return remaining.some(e=>distBetween(+ev.lat,+ev.lon,e.lat_a,e.lon_a)<rad);
        });
        if(onRoute.length>0){
          showMsg(`路線上出現 ${onRoute.length} 個新事件，重新計算...`,'info');
          reroute(gpsCoord.lat,gpsCoord.lon);
        }
      }
      lastEventHash=evHash;
    }

    overlayGroups.congestion.clearLayers();overlayGroups.events.clearLayers();overlayGroups.weather.clearLayers();
    let cC=0,cE=0;
    for(const ev of events){
      const lat=+ev.lat,lon=+ev.lon,sev=+ev.severity||0.5,rad=(+ev.radius_km||0.5)*1000;
      if(!lat||!lon)continue;
      if(ev.event_type==='congestion'&&ev.source==='realtime'){
        cC++;
        L.circleMarker([lat,lon],{radius:4,fillColor:sevColor(sev),color:'rgba(0,0,0,.3)',weight:1,fillOpacity:.8})
          .bindPopup(`壅塞 sev=${sev.toFixed(2)}`).addTo(overlayGroups.congestion);
      }else{
        cE++;const col=evtColors[ev.event_type]||'#a78bfa';
        L.circle([lat,lon],{radius:rad,fillColor:col,color:col,weight:1.5,fillOpacity:.15,opacity:.5})
          .bindPopup(`${ev.event_type} sev=${sev.toFixed(2)}`).addTo(overlayGroups.events);
      }
    }
    let cW=0;
    for(const wx of weather){
      const lat=+wx.lat,lon=+wx.lon,rad=(+wx.radius_km||30)*1000;
      const rain=+wx.rain_level||0,wind=+wx.wind_level||0,vis=+wx.visibility_level||0;
      const mx=Math.max(rain,wind,vis);if(mx<0.01)continue;cW++;
      const col=rain>=wind&&rain>=vis?'#2288ff':wind>=vis?'#44bb88':'#888';
      L.circle([lat,lon],{radius:rad,fillColor:col,color:col,weight:1,fillOpacity:Math.min(.12,mx*.15),opacity:.25})
        .addTo(overlayGroups.weather);
    }
    document.getElementById('olCong').textContent=cC;
    document.getElementById('olEvt').textContent=cE;
    document.getElementById('olWx').textContent=cW;
  }catch(e){}
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.layer-btn')&&!e.target.closest('.layer-dropdown'))
    document.getElementById('layerDrop').classList.remove('show');
});

// Init
setupSearch('inputStart','sugStart',(lat,lon,label)=>setStart(lat,lon,label));
setupSearch('inputEnd','sugEnd',(lat,lon,label)=>setEnd(lat,lon,label));
ping();initGps();loadOverlays();
setInterval(ping,30000);setInterval(loadOverlays,60000);
</script>
